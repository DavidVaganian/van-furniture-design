<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAN — Furniture Design &amp; Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<style>
:root{
  --ink:#101317; --ink-2:#1A1F25; --ink-3:#2C333B;
  --bone:#F5F5F3; --bone-2:#FBFBFA; --paper:#FFFFFF;
  --hair:#DFE0DD; --hair-2:#EBEBE8; --mute:#6B7480;
  --accent:#2743E0;            /* cool + saturated: never collides with a material swatch */
  --flag:#FF6A00;              /* only ever means "this part / this warning" */
  --ok:#1B8F52; --warn:#B87A00; --err:#C4382B;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Manrope','Noto Sans Armenian',system-ui,-apple-system,sans-serif;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bone);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ── brand bar ─────────────────────────────────────────── */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:40}
.top .in{max-width:1180px;margin:0 auto;padding:0 22px;height:60px;display:flex;align-items:center;gap:20px}
.mark{display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff;flex:0 0 auto}
.mark .w{font-weight:800;font-size:23px;letter-spacing:.30em;line-height:1;padding-left:.30em}
.mark .r{width:1px;height:26px;background:rgba(255,255,255,.24)}
.mark .s{font-size:8.5px;letter-spacing:.20em;text-transform:uppercase;color:#93A0AD;line-height:1.35;font-weight:600}
.top .sp{flex:1}
.project-tools{display:flex;align-items:center;gap:7px;min-width:0}
.project-tools button{font-family:var(--sans);font-size:12px;font-weight:700;color:#DCE2E8;background:var(--ink-2);
  border:1px solid rgba(255,255,255,.14);border-radius:3px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.project-tools button:hover{border-color:rgba(255,255,255,.45);color:#fff}
.save-status{font-family:var(--mono);font-size:9.5px;color:#93A0AD;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{display:flex;gap:1px;background:var(--ink-2);border-radius:var(--r);padding:2px}
.lang button{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.04em;color:#93A0AD;
  background:none;border:0;padding:7px 13px;border-radius:2px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* ── step rail ─────────────────────────────────────────── */
.rail{background:var(--ink-2);border-top:1px solid rgba(255,255,255,.07)}
.rail .in{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;align-items:stretch;gap:0}
.rail button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:13px 6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;color:#6E7B88;font-family:var(--sans);
  font-weight:600;font-size:13px;transition:color .15s}
.rail button .n{width:21px;height:21px;border-radius:50%;border:1.5px solid currentColor;display:grid;
  place-items:center;font-family:var(--mono);font-size:10px;font-weight:600;flex:0 0 21px}
.rail button.done{color:#9FB0BE}
.rail button.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rail button.on{color:#fff;border-bottom-color:var(--flag)}
.rail button.on .n{background:var(--flag);border-color:var(--flag);color:#fff}
.rail button:disabled{opacity:.35;cursor:not-allowed}

.wrap{max-width:1180px;margin:0 auto;padding:0 22px 90px}
h1{font-weight:800;font-size:31px;letter-spacing:-.022em;margin:38px 0 7px;line-height:1.12}
.lede{font-size:16px;color:var(--mute);margin-bottom:26px;max-width:60ch}
h2{font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:11px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.card{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r);padding:20px}
.hide{display:none!important}

/* ── drop ──────────────────────────────────────────────── */
.modesw{display:inline-flex;align-items:center;gap:10px;background:var(--paper);
  border:1px solid var(--hair);border-radius:var(--r);padding:11px 15px;margin-bottom:18px;
  cursor:pointer;font-size:14.5px;font-weight:600;user-select:none}
.modesw:hover{border-color:var(--accent)}
.modesw input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.recent button{font-family:var(--sans);font-size:12.5px;font-weight:600;background:var(--bone-2);
  border:1px solid var(--hair);border-radius:20px;padding:5px 11px;cursor:pointer;color:var(--ink);
  display:inline-flex;align-items:center;gap:6px}
.recent button:hover{border-color:var(--accent);color:var(--accent)}
.recent .sw{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.colourchip{display:inline-flex;align-items:center;gap:8px}
.colourchip .box{width:26px;height:26px;border-radius:3px;border:1px solid var(--hair)}
.editable{position:relative;touch-action:none}
.editable svg{display:block;width:100%;height:auto}
.grip{cursor:ns-resize;fill:transparent}
.grip.gv{cursor:ew-resize}
.editable.dragging{user-select:none}
.editable.dragging .grip{pointer-events:none}
.sizerow.sel{background:rgba(31,111,235,.10);border-radius:4px}
.sizerow [data-cdup],.sizerow [data-cdel]{border:none;background:none;cursor:pointer;font-size:13px;opacity:.65}
.sizerow [data-cdup]:hover,.sizerow [data-cdel]:hover{opacity:1}
.grip.on~.gripline,.editable:not(.dragging) .grip:hover~.gripline{stroke:var(--accent);stroke-width:1.6}
.gripline{pointer-events:none;transition:stroke .12s}
.partpop{position:absolute;z-index:6;background:var(--paper);border:1px solid var(--hair);border-radius:6px;
  box-shadow:0 8px 28px rgba(16,19,23,.18);padding:9px 9px 8px;display:flex;flex-direction:column;gap:6px;
  font-size:12.5px;min-width:158px;max-width:200px}
.partpop .ph{font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.partpop .prow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.partpop button{font-family:var(--sans);font-size:12px;font-weight:600;border:1px solid var(--hair);
  background:var(--bone-2);border-radius:4px;padding:5px 8px;cursor:pointer;color:var(--ink);line-height:1}
.partpop button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.partpop button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.partpop button:disabled{opacity:.4;cursor:not-allowed}
.partpop .pclose{position:absolute;top:2px;right:4px;border:0;background:none;font-size:15px;padding:2px 5px;color:var(--mute)}
.msg.act{cursor:pointer;transition:filter .12s}
.msg.act:hover{filter:brightness(.96)}
.bub{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;
  font-family:var(--mono);font-size:10.5px;font-weight:700;margin-right:6px;vertical-align:1px}
.bub.err{background:var(--err)}.bub.warn{background:var(--warn)}.bub.ok{background:var(--ok)}
.fixbtn.primary{background:var(--ink)}
#glhost{width:100%;height:520px;border-radius:var(--r);overflow:hidden;background:#EEEDEA;
  position:relative;cursor:grab;touch-action:none}
#glhost.drag{cursor:grabbing}
#glhost canvas{display:block;width:100%;height:100%}
.gltools{position:absolute;left:12px;bottom:12px;display:flex;gap:7px;z-index:3}
.gltools button{font-family:var(--sans);font-size:12.5px;font-weight:600;background:rgba(255,255,255,.94);
  border:1px solid var(--hair);border-radius:20px;padding:7px 13px;cursor:pointer;color:var(--ink)}
.gltools button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.glnote{position:absolute;right:12px;bottom:12px;font-size:11.5px;color:var(--mute);z-index:3}
.studio-shell{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 318px;height:650px;background:#d9d8d5;overflow:hidden}
.studio-stage{position:relative;min-width:0;cursor:grab;touch-action:none;outline:none}.studio-stage.drag{cursor:grabbing}.studio-stage.move,.studio-stage.move canvas{cursor:move}.studio-stage.drop{box-shadow:inset 0 0 0 4px var(--accent)}.studio-stage canvas{display:block;width:100%;height:100%}
.studio-top{position:absolute;z-index:5;left:14px;right:14px;top:14px;display:flex;align-items:center;gap:7px;pointer-events:none}.studio-top>*{pointer-events:auto}
.studio-top button,.studio-float button{border:1px solid rgba(20,24,28,.14);background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-radius:999px;padding:9px 13px;cursor:pointer;font:700 12px/1 var(--sans);box-shadow:0 3px 14px rgba(20,24,28,.08);color:var(--ink)}
.studio-top button:hover,.studio-top button[aria-pressed="true"],.studio-float button:hover{background:var(--ink);color:#fff}.studio-top .spacer{flex:1}
.studio-measure{font:700 11px/1 var(--mono);padding:9px 12px;border-radius:999px;background:rgba(16,19,23,.86);color:#fff;box-shadow:0 3px 14px rgba(20,24,28,.14)}
.studio-float{position:absolute;left:14px;bottom:14px;z-index:5;display:flex;gap:7px}.studio-tip{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);z-index:4;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.9);font-size:11px;color:var(--mute);white-space:nowrap;pointer-events:none}
.studio-side{position:relative;z-index:6;background:#fff;border-left:1px solid var(--hair);display:flex;flex-direction:column;min-width:0;overflow:hidden}.studio-side-head{padding:18px 18px 13px;border-bottom:1px solid var(--hair)}
.studio-side-head small{display:block;color:var(--mute);font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}.studio-side-head strong{display:block;font-size:20px;letter-spacing:-.02em}.studio-side-head span{display:block;margin-top:4px;color:var(--mute);font:11px/1.45 var(--mono)}
.studio-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--hair)}.studio-tabs button{border:0;border-bottom:2px solid transparent;background:#fff;padding:11px 4px 9px;cursor:pointer;font:700 10.5px/1 var(--sans);color:var(--mute)}.studio-tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.studio-scroll{padding:14px 16px 22px;overflow:auto;flex:1}.studio-section{margin-bottom:20px}.studio-section h4{margin:0 0 9px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.studio-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.studio-card{display:grid;place-items:center;min-height:74px;padding:10px 6px;border:1px solid var(--hair);border-radius:7px;background:#fff;cursor:grab;text-align:center;font:700 11.5px/1.25 var(--sans);color:var(--ink)}.studio-card:hover{border-color:var(--accent);color:var(--accent);background:#f8fbff}.studio-card:active{cursor:grabbing}.studio-card .icon{font-size:24px;font-weight:400;margin-bottom:5px}
.studio-palette{display:flex;flex-wrap:wrap;gap:9px}.studio-swatch{width:48px;height:48px;border-radius:50%;border:3px solid #fff;outline:1px solid var(--hair);cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.08)}.studio-swatch[aria-pressed="true"]{outline:3px solid var(--ink)}
.studio-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.studio-field{display:grid;gap:4px}.studio-field label{font-size:10.5px;color:var(--mute)}.studio-field input,.studio-field select{width:100%;min-width:0;padding:9px 8px;border:1px solid var(--hair);border-radius:5px;background:#fff;font:600 12px/1 var(--mono)}
.studio-action{width:100%;margin-top:8px;padding:10px;border:1px solid var(--hair);border-radius:5px;background:#fff;cursor:pointer;font:700 12px/1 var(--sans);color:var(--ink)}.studio-action.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.studio-action.danger{color:var(--err)}.studio-action:hover{border-color:var(--accent)}
.studio-selected{border:1px solid #c9dcff;background:#f4f8ff;border-radius:7px;padding:11px;margin-bottom:16px}.studio-selected b{display:block;font-size:13px}.studio-selected span{display:block;margin-top:4px;color:var(--mute);font:10.5px/1.45 var(--mono)}
.studio-keyhelp{margin:10px 0 0;padding:9px 10px;border-radius:6px;background:#f3f3f1;color:var(--mute);font:10px/1.55 var(--mono)}
.studio-empty{padding:18px 12px;text-align:center;color:var(--mute);font-size:12px;line-height:1.5}.studio-status{position:absolute;right:334px;top:64px;z-index:7;border-radius:5px;background:rgba(16,19,23,.88);color:#fff;padding:8px 10px;font:600 11px/1.2 var(--sans);opacity:0;transform:translateY(-4px);transition:.18s;pointer-events:none}.studio-status.show{opacity:1;transform:none}
@media(max-width:820px){.studio-shell{grid-template-columns:1fr;height:780px}.studio-stage{height:445px}.studio-side{height:335px;border-left:0;border-top:1px solid var(--hair)}.studio-scroll{padding-bottom:18px}.studio-tip{display:none}.studio-status{right:12px;top:60px}.studio-top{gap:4px}.studio-top button{padding:8px 9px;font-size:10px}.studio-measure{display:none}}
.hint{font-size:12.5px;color:var(--mute);margin:9px 0 4px;display:flex;align-items:center;gap:7px}
.hint::before{content:'';width:15px;height:2px;background:var(--accent);border-radius:1px;flex:0 0 15px}
.sizerow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--hair-2)}
.sizerow:last-child{border-bottom:0}
.sizerow .nm{flex:1;font-size:13.5px}
.sizerow input{width:82px;font-family:var(--mono);font-size:15px;font-weight:600;text-align:right;
  padding:7px 9px;border:1px solid var(--hair);border-radius:var(--r)}
.sizerow input:focus{border-color:var(--accent)}
.sizerow .pin{font-family:var(--mono);font-size:11px;color:var(--accent);width:16px;text-align:center}
.sizerow button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:15px;padding:2px 5px}
.sizerow button:hover{color:var(--err)}
.param-studio{margin:14px 0 12px;border:1px solid var(--hair);border-radius:8px;background:#fff;overflow:hidden}
.param-studio>summary{display:flex;align-items:center;gap:9px;padding:13px 14px;cursor:pointer;list-style:none;font-size:14px;font-weight:700}
.param-studio>summary::-webkit-details-marker{display:none}.param-studio>summary:after{content:'+';margin-left:auto;color:var(--mute);font:600 18px/1 var(--mono)}
.param-studio[open]>summary:after{content:'−'}.param-studio[open]>summary{border-bottom:1px solid var(--hair)}
.param-badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;background:#edf4ff;color:var(--accent);font:700 10px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.param-body{display:grid;grid-template-columns:minmax(150px,.78fr) minmax(230px,1.22fr);min-height:260px}
.model-tree{padding:12px;border-right:1px solid var(--hair);background:#f8fafc}.model-tree h3,.inspector h3,.history-pane h3{margin:0 0 9px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.tree-btn{display:flex;width:100%;align-items:center;gap:7px;border:0;background:none;border-radius:4px;padding:7px 8px;text-align:left;cursor:pointer;font:600 12px/1.25 var(--sans);color:var(--ink)}
.tree-btn.sub{padding-left:23px;font-weight:500;color:#4d5866}.tree-btn:hover,.tree-btn.sel{background:#e9f2ff;color:var(--accent)}
.tree-dot{width:7px;height:7px;border-radius:50%;background:#9ca8b5;flex:none}.tree-btn.sel .tree-dot{background:var(--accent)}
.inspector{padding:13px 14px}.inspect-title{font-size:16px;font-weight:700;margin-bottom:3px}.inspect-meta{font:11px/1.4 var(--mono);color:var(--mute);margin-bottom:12px}
.param-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.param-field{display:grid;gap:4px}.param-field.wide{grid-column:1/-1}
.param-field label{font-size:11px;color:var(--mute)}.param-field input,.param-field select{width:100%;min-width:0;border:1px solid var(--hair);border-radius:4px;background:#fff;padding:8px 9px;font:600 13px/1 var(--mono)}
.param-field input:focus,.param-field select:focus{border-color:var(--accent);outline:2px solid rgba(31,111,235,.12)}.param-field small{font:10px/1.35 var(--mono);color:var(--mute)}
.constraint-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.constraint-row button,.history-jump{border:1px solid var(--hair);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer;font:600 11px/1 var(--sans);color:var(--ink)}
.constraint-row button:hover,.history-jump:hover{border-color:var(--accent);color:var(--accent)}.constraint-row button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.variable-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--hair);border-top:1px solid var(--hair)}.variable-strip div{background:#fff;padding:9px 11px}.variable-strip b{display:block;font:700 10px/1.2 var(--mono);color:var(--mute)}.variable-strip span{font:600 13px/1.5 var(--mono)}
.param-error{margin-top:8px;padding:7px 9px;border-radius:4px;background:#fff1ef;color:var(--err);font-size:11px}.param-ok{margin-top:8px;color:#17824d;font-size:11px}
.history-pane{padding:12px 14px;border-top:1px solid var(--hair);background:#fbfcfd}.history-head{display:flex;align-items:center;gap:8px}.history-head h3{margin-right:auto}.history-count{font:10px/1 var(--mono);color:var(--mute)}
.history-list{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:3px 0 1px}.history-step{white-space:nowrap;border:1px solid var(--hair);border-radius:4px;background:#fff;padding:6px 8px;font-size:10.5px;color:#4d5866}.history-step.current{border-color:var(--accent);color:var(--accent);font-weight:700}.history-step.future{border-style:dashed}.history-step button{border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit}
@media(max-width:680px){.param-body{grid-template-columns:1fr}.model-tree{border-right:0;border-bottom:1px solid var(--hair)}.variable-strip{grid-template-columns:repeat(2,1fr)}}
.dropwrap{position:relative}
.drop{background:var(--paper);border:1.5px dashed var(--hair);border-radius:var(--r);padding:58px 24px;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.hot{border-color:var(--accent);background:#F7F8FF}
.drop .big{font-weight:700;font-size:20px;margin-bottom:5px;letter-spacing:-.01em}
.drop .sm{color:var(--mute);font-size:14px}
.drop .fmt{color:var(--mute);font-size:12px;margin-top:9px;opacity:.8}
.busy{position:absolute;inset:0;background:rgba(255,255,255,.96);border:1.5px solid var(--hair);
  border-radius:var(--r);display:grid;place-content:center;text-align:center;gap:5px;z-index:5}
.busy .big{font-weight:700;font-size:19px}
.busy .sm{color:var(--mute);font-size:14px}
.busy.err .big{color:var(--err)}
.or{text-align:center;color:var(--mute);font-size:11px;margin:26px 0 14px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700}
.catlbl{color:var(--mute);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:20px 0 10px}
.catrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.catbtn{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r);padding:9px 15px;cursor:pointer;
  font-family:var(--sans);font-weight:600;font-size:14px;color:var(--ink);transition:border-color .15s,background .15s}
.catbtn:hover{border-color:var(--accent)}
.catbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.soonmsg{color:var(--mute);font-size:14px;padding:14px 0;line-height:1.5}
.colhead{margin:16px 0 6px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px}
.colhead:first-child{margin-top:0}
.colhead .ctl button{font-size:13px;line-height:1;padding:3px 8px;border:1px solid var(--hair);background:var(--paper);border-radius:4px;cursor:pointer}

"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   VAN — FOUNDING CONSTRAINTS
   Extracted from the master prompt. These are not comments. Every change
   to this file is checked against them, and a change that violates one is
   wrong even when it works. Read before editing.

   §1  USER-FRIENDLINESS IS THE PRODUCT.
       Test every feature: "can a normal employee use this with no
       training?" If the answer needs a caveat, the feature is not done.
       Complexity lives inside the code. The user experiences simplicity.

   §2  THE SOFTWARE GUIDES; IT DOES NOT INTERROGATE.
       Sensible defaults, automatic calculation, visible feedback. If a
       value can be computed, compute it. If it can be inferred, infer it.
       Ask only for what genuinely cannot be known.

   §3  ONE SOURCE OF TRUTH: parameters + rules + overrides.
       Components are COMPUTED, never stored. Change a dimension and every
       part, drawing and list follows. Nothing can go stale because nothing
       authoritative was written down twice.

   §4  INTEGER TENTHS OF A MILLIMETRE, EVERYWHERE INSIDE.
       Floats put 963.9999 on a cut list. Convert only at the display edge.

   §5  NEVER BLOCK WITHOUT OFFERING THE WAY OUT.
       An error that a person cannot act on from where they stand is a
       defect, not a safeguard. Every blocking message carries its fix.

   §6  THE DRAWING IS THE DELIVERABLE.
       A worker must build from it without asking a question. Dimension
       the INSIDE, not just the box. Text sized in sheet millimetres so it
       stays readable at any cabinet size.

   §7  ONE RENDERER FOR SCREEN AND PRINT.
       Two code paths drift, and the drift is discovered by a customer
       holding a wrong drawing.

   §8  EVERY STRING IS TRANSLATED. EN / ՀԱՅ / РУС, no exceptions.
       A hard-coded sentence is a bug even if it reads correctly in English.

   §9  MODIFY, DO NOT REBUILD.
       Preserve working behaviour. Change what is necessary. Check for side
       effects. This is one continuous project, not a series of rewrites.

   §10 PROVE IT, DO NOT ASSERT IT.
       Claims about the output are verified by measuring the output. A test
       that passes while the app is unusable is worse than no test.

   §11 SIMPLE, SEXY, USER-FRIENDLY IS THE FLOOR, NOT THE CEILING.
       No upgrade may make the common path longer or the screen busier.
       Power belongs behind a deliberate gesture, never in the way.

function cutParts(res){

    ? p.varied.map((h,i)=>({...p,q:1,fl:h,cl:h-(p.fl-p.cl),boxes:[p.boxes[i]]})) : [p]);

/* §3 §6 — ONE numbering, shared by the on-screen cut list, the printed
   schedule panel and every balloon drawn on any sheet, so "#14" always means
   the same physical piece everywhere it is printed. Both consumers already
   number rows by walking compactCutParts(res) in order (which for a kitchen
   merges same-dimension pieces from different parts, and always expands a
   varied drawer/divider front into one row per distinct length) — this walks
   res.parts in that exact same order and records, for every (part index, box
   index), which row it landed in, so a balloon anywhere can look its number
   up instead of using the raw res.parts index (which drifts the moment any
   merge or expansion happens — the two used to disagree silently). */

        <text x="${col[2]-6}" y="${y}" font-family="${TEC}" font-size="2.9" fill="${INK}" text-anchor="end">${p.q}</text>
        <text x="${col[3]}" y="${y}" font-family="${TEC}" font-size="2.9" fill="${INK}" text-anchor="end">${N(mmv(p.cl))} × ${N(mmv(p.cw))} × ${N(mmv(p.th))}</text>`;
    g+=`<line x1="${X}" y1="${y+1.4}" x2="${X+W}" y2="${y+1.4}" stroke="${GREY}" stroke-width=".08"/>`;
  });
  y+=6;
  g+=`<line x1="${X}" y1="${y-2.6}" x2="${X+W}" y2="${y-2.6}" stroke="${INK}" stroke-width="${LWB}"/>`;
  const note=(k,v)=>{g+=`<text x="${X}" y="${y}" font-family="${TEC}" font-size="2.8" fill="${GREY}">${k}</text>
    <text x="${X+W}" y="${y}" font-family="${TEC}" font-size="2.8" fill="${INK}" text-anchor="end">${v}</text>`;y+=4.2;};
  note(T('materialq'),T('materials')[cfg.material||'laminate']);

  note(T('handlesq'),T('handles')[cfg.handles||'bar']);
  if(res.hinges)note(T('totalHinges'),String(res.totalHinges));

}

function validateKitchen(cfg,fit,res){
  const m=[],types=cfg.kitchen.units.map(u=>u.type),free=fit.W-kitchenUsed(cfg);
  const workH=res.plinthH+res.baseH+res.worktopT;
  if(workH<mm(850)||workH>mm(950))m.push({l:'warn',t:fmt('vKitchenWorktop',{n:N(mmv(workH))}),fixes:[{k:'kwork',v:900,label:T('fixKitchenWorktop')}]});
  else m.push({l:'ok',t:fmt('vKitchenWorktopOk',{n:N(mmv(workH))})});
  const needed=res.plinthH+res.baseH+res.worktopT+(cfg.kitchen.wallUnits?res.gap+res.wallH:0);
  if(fit.H<needed)m.push({l:'err',t:fmt('vKitchenHeightErr',{needed:N(mmv(needed)),have:N(mmv(fit.H))}),fixes:[{k:'kitchenheight',v:N(mmv(needed)),label:fmt('fixKitchenHeight',{n:N(mmv(needed))})}],anchor:{x:0,y:0,w:mmv(fit.W),h:mmv(fit.H)}});
  if(free<0)m.push({l:'err',t:fmt('vKitchenOverflow',{over:N(-mmv(free))}),fixes:[{k:'kitchenfit',v:1,label:T('fixKitchenFit')}],anchor:{x:0,y:0,w:mmv(fit.W),h:mmv(fit.H)}});
  else m.push({l:'ok',t:fmt('vKitchenFit',{free:N(mmv(free))})});
  if(res.worktopPieces>1||res.plinthPieces>1)m.push({l:'ok',t:fmt('vKitchenLinearSplit',{worktop:res.worktopPieces,plinth:res.plinthPieces})});
  if(!types.includes('sink'))m.push({l:'warn',t:T('vKitchenMissingSink'),fixes:[{k:'kitchenadd',v:'sink',label:T('fixAddSink')}]});
  if(!types.some(t=>t==='oven'||t==='tallOven'))m.push({l:'warn',t:T('vKitchenMissingHob'),fixes:[{k:'kitchenadd',v:'oven',label:T('fixAddOven')}]});
  if(!types.some(t=>t==='tallFridge'||t==='freeFridge'))m.push({l:'warn',t:T('vKitchenMissingFridge'),fixes:[{k:'kitchenadd',v:'tallFridge',label:T('fixAddFridge')}]});
  const si=types.indexOf('sink'),di=types.indexOf('dishwasher');
  if(si>=0&&di>=0&&Math.abs(si-di)!==1)m.push({l:'warn',t:T('vKitchenDishwasher')});
  const oi=types.findIndex(t=>t==='oven'||t==='tallOven');
  if(oi>=0){const left=cfg.kitchen.units[oi-1],right=cfg.kitchen.units[oi+1];if((!left||kitchenTall(left.type))&&(!right||kitchenTall(right.type)))m.push({l:'warn',t:T('vKitchenLanding')});}
  const S=SH(cfg),P=T('parts');
  for(const x of cutParts(res)){if(x.mat==='back'||x.mat==='box'||x.mat==='worktop'||orient(x,S)==='along')continue;
    const o=orient(x,S),base={p:P[x.k],a:F(x.cl),b:F(x.cw),sl:F(S.l),sw:F(S.w)},fixes=[];
    SHEETS.forEach((q,i)=>{if(i!==(cfg.sheet||0)&&orient(x,q)!=='nofit'&&!fixes.some(f=>f.k==='sheet'))fixes.push({k:'sheet',v:i,label:fmt('fixSheet',{s:q.n})});});
    if(o==='across')fixes.unshift({k:'rotate',v:1,label:T('fixRotate')});
    m.push({l:o==='nofit'?'err':'warn',t:fmt(o==='across'?'vSheetRot':'vSheet',base),fixes,anchor:x.boxes.length?box(x.boxes[0]):null});
  }
  if(!m.some(x=>x.l==='err'))m.push({l:'ok',t:fmt('vSheetOK',{sl:F(S.l),sw:F(S.w)})});
  return m;
}
function validate(cfg,fit,res){
  if(isKitchen(cfg))return validateKitchen(cfg,fit,res);
  /* §5: nothing blocks without a way out. Every message carries at least one
     one-click fix and an anchor so it can be shown on the drawing. */
  const m=[],P=T('parts'),W=mmv(fit.W),H=mmv(fit.H);
  if(cfg.wardrobePlanner){
    const s=wardrobePlannerStats(cfg.wardrobePlanner);
    if(s.backFree<0)m.push({l:'err',t:fmt('vPlannerBack',{n:N(Math.abs(mmv(s.backFree)))}),fixes:[{k:'plannerroom',v:'back',label:T('fixPlannerWidth')}]});
    if(s.rightFree<0)m.push({l:'err',t:fmt('vPlannerRight',{n:N(Math.abs(mmv(s.rightFree)))}),fixes:[{k:'plannerroom',v:'right',label:T('fixPlannerDepth')}]});
    if(s.heightFree<mm(10))m.push({l:s.heightFree<0?'err':'warn',t:fmt('vPlannerHeight',{n:N(mmv(s.heightFree))}),fixes:[{k:'plannerroom',v:'height',label:T('fixPlannerClearance')}]});
    if(s.collisions.length){const id=s.collisions[0].obstacle;m.push({l:'err',t:fmt('vPlannerCollision',{n:s.collisions.length,s:s.collisions.length===1?'':'s'}),fixes:[{k:'plannerremoveob',v:id,label:T('fixPlannerCollision')}]});}
  }
  if(res.bathroom){
    const B=res.bathroomModel,n=res.basins.length,over=res.basins.some(b=>b.x<0||b.x+b.w>fit.W||b.d>fit.D+res.worktopOverhang),overlap=n>1&&res.basins.some((b,i)=>res.basins.slice(i+1).some(q=>Math.max(b.x,q.x)<Math.min(b.x+b.w,q.x+q.w)));
    const rim=(B.floorClearance||0)+fit.H+(B.worktopT||0)+(B.basinType==='vessel'?(B.basinH||0):0);
    if(rim<mm(800)||rim>mm(950))m.push({l:'warn',t:fmt('vBathRim',{n:N(mmv(rim))}),fixes:[{k:'bathrim',v:B.basinType==='vessel'?900:850,label:fmt('fixBathRim',{n:B.basinType==='vessel'?900:850})}]});
    else m.push({l:'ok',t:fmt('vBathRimOk',{n:N(mmv(rim))})});
    if(over||overlap)m.push({l:'err',t:T('vBathLayout'),fixes:[{k:'bathlayout',v:1,label:T('fixBathLayout')}],anchor:{x:0,y:0,w:W,h:H}});
    if(B.basinType==='vessel'&&B.basinH<mm(20))m.push({l:'warn',t:T('vBathVesselLow'),fixes:[{k:'bathfield',v:mm(20),c:0,label:T('fixBathVessel')}]});
    if(n)m.push({l:'ok',t:fmt('vBathSummary',{n,type:T(B.basinType==='vessel'?'typeCountertop':'typeIntegrated'),
      s1:n===1?'':'s',c:res.cutouts.length,s2:res.cutouts.length===1?'':'s',p:res.plumbingNotches,s3:res.plumbingNotches===1?'':'s'})});
  }
  if(isBed(cfg)){
    const B=bedEnsure(cfg),needW=B.mattressW+2*(B.clearance||0),needD=B.mattressL+2*(B.clearance||0);
    if(fit.W<needW||fit.D<needD)m.push({l:'err',t:fmt('vBedFit',{mw:N(mmv(B.mattressW)),ml:N(mmv(B.mattressL)),needW:N(mmv(needW)),needD:N(mmv(needD))}),fixes:[{k:'bedfit',v:1,label:T('fixBedFit')}]});
    else m.push({l:'ok',t:fmt('vBedFitOk',{mw:N(mmv(B.mattressW)),ml:N(mmv(B.mattressL))})});
  }
  const out=Math.max(fit.wOut,fit.hOut);
  if(fit.wOut>2*fit.scribe||fit.hOut>fit.scribe){
    const need=Math.ceil(mmv(Math.max(fit.wOut/2,fit.hOut))/5)*5;
    m.push({l:'err',t:fmt('vSquareErr',{d:F(out),s:F(fit.scribe)}),
      fixes:[{k:'scribe',v:need,label:fmt('fixScribe',{n:need})}],
      anchor:{x:0,y:0,w:W,h:H,edge:'left'}});
  }else{
    m.push({l:'ok',t:fmt('vFit',{W:F(fit.W),H:F(fit.H)})});
    if(fit.wOut>R.squareTol||fit.hOut>R.squareTol)
      m.push({l:'warn',t:fmt('vSquareWarn',{d:F(out)}),
        fixes:[{k:'scribe',v:Math.ceil(mmv(fit.scribe)*1.5/5)*5,
          label:fmt('fixScribe',{n:Math.ceil(mmv(fit.scribe)*1.5/5)*5})}],
        anchor:{x:0,y:0,w:W,h:H,edge:'left'}});
  }
  /* every section is checked, not just the first — and the fix acts on the
     section that is actually at fault (§5, §10). */
  const nSec=(res.columns&&res.columns.length)||1;
  res.parts.filter(p=>p.k==='door').forEach(d=>{
    if(d.fw<=R.maxDoorW)return;
    const ci=d.col||0;
    const fixes=d.plannerFront
      ?[{k:'plannerfrontcount',c:ci,v:Math.ceil(d.fw*d.q/R.maxDoorW),label:fmt('fixDoors',{n:Math.ceil(d.fw*d.q/R.maxDoorW)})}]
      :[{k:'doorcount',c:ci,v:(d.q||2)+1,label:fmt('fixDoors',{n:(d.q||2)+1})},{k:'splitcol',c:ci,v:ci,label:fmt('fixSplit',{n:nSec+1})}];
    m.push({l:'warn',t:fmt('vDoorWide',{w:F(d.fw),max:F(R.maxDoorW)}),fixes,
      anchor:box(d.boxes[0])});
  });
  res.parts.filter(p=>p.k==='shelf').forEach(sh=>{
    const lvl=sh.fl>R.shelfSagErr?'err':sh.fl>R.shelfSagWarn?'warn':null;
    if(!lvl)return;
    const ci=sh.col||0;
    m.push({l:lvl,t:fmt(lvl==='err'?'vSagErr':'vSagWarn',{s:F(sh.fl)}),
      fixes:[{k:'splitcol',c:ci,v:ci,label:fmt('fixSplit',{n:nSec+1})}],
      anchor:box(sh.boxes[0])});
  });
  const S=SH(cfg);
  for(const x of cutParts(res)){
    if(x.mat==='back'||x.mat==='box')continue;
    const o=orient(x,S);
    if(o==='along')continue;
    const base={p:P[x.k],a:F(x.cl),b:F(x.cw),sl:F(S.l),sw:F(S.w)};
    const fixes=[];let suffix='';
    if(o==='across'){
      if(cfg.rotate)continue;
      const grainless=(cfg.material==='painted'||cfg.material==='laminate');
      fixes.push({k:'rotate',v:1,label:T('fixRotate')});
      suffix=' '+T(grainless?'rotFree':'rotCosts');
      if(!grainless)fixes.push({k:'material',v:'laminate',label:T('fixMaterial')});
    }
    SHEETS.forEach((q,i)=>{ if(i===(cfg.sheet||0))return;
      if(orient(x,q)!=='nofit'&&!fixes.some(f=>f.k==='sheet'))
        fixes.push({k:'sheet',v:i,label:fmt('fixSheet',{s:q.n})}); });
    if(x.k==='drawerfront'||x.k==='door'){
      const ci=x.col||0;
      fixes.push({k:'splitcol',c:ci,v:ci,label:fmt('fixSplit',{n:nSec+1})});
    }
    m.push({l:'err',t:fmt(o==='across'?'vSheetRot':'vSheet',base)+suffix,fixes,
      anchor:x.boxes.length?box(x.boxes[0]):null});
  }
  if(cfg.rotate)m.push({l:'warn',t:T('vRotated'),
    fixes:[{k:'unrotate',v:1,label:T('fixUnrotate')}]});
  if(!m.some(x=>x.l==='err'))m.push({l:'ok',t:fmt('vSheetOK',{sl:F(S.l),sw:F(S.w)})});
  return m;
}
const box=b=>b?{x:mmv(b.x),y:mmv(b.y),w:mmv(b.w),h:mmv(b.h)}:null;

/* Visual-CPQ style estimate — a pure function over the SAME cut list the
   drawing is made of, so the number and the drawing can never disagree (§3).
   Every rate is a placeholder in RATES until a real workshop sets it. */
function price(res,cfg,fit){
  const grp={};
  for(const x of cutParts(res)){ if(x.mat==='rail')continue;
    (grp[x.mat]||(grp[x.mat]={a:0})).a+=(x.cl/10)*(x.cw/10)*x.q/1e6; }
  const St=SH(cfg), sa=(St.l/10)*(St.w/10)/1e6;
  let materials=0, sheets=0, area=0;
  for(const k in grp){
    const sh=Math.max(1,Math.ceil(grp[k].a/(sa*R.yield)));
    sheets+=sh; area+=grp[k].a;
    materials+=sh*(RATES.sheet[k]||RATES.sheet._);
  }
  const edgeM=cutParts(res).reduce((a,x)=>x.edgeCode
    ?a+((x.edges.l?x.cl:0)+(x.edges.rt?x.cl:0)+(x.edges.tp?x.cw:0)+(x.edges.bt?x.cw:0))*x.q:a,0)/1e4*1.1;
  const edging=edgeM*RATES.edgePerM;
  const nDF=res.parts.filter(p=>p.k==='drawerfront').reduce((a,p)=>a+p.q,0);
  const rails=res.parts.filter(p=>p.k==='rail').reduce((a,p)=>a+p.q,0);
  const handled=cfg.handles&&cfg.handles!=='none'&&cfg.handles!=='grooved';
  const plannerHandles=cfg.wardrobePlanner?cfg.wardrobePlanner.frames.reduce((n,f,i)=>{
    if(!f.handle||f.handle==='none'||f.handle==='grooved')return n;
    const dq=res.parts.filter(p=>p.col===i&&((p.plannerFront&&p.k==='door')||(!f.front||f.front==='none')&&p.k==='drawerfront')).reduce((a,p)=>a+p.q,0);
    return n+dq;
  },0):null;
  const hardware=res.totalHinges*RATES.hinge
    + res.nShelf*4*RATES.shelfPin
    + (plannerHandles==null?(handled?(res.nDoor+nDF)*RATES.handle:0):plannerHandles*RATES.handle)
    + rails*RATES.railUnit;
  const parts=res.parts.reduce((a,x)=>a+x.q,0);
  const labour=parts*RATES.labourPerPart + area*RATES.labourPerM2;
  const cost=materials+edging+hardware+labour;
  const total=Math.round(cost*(1+RATES.margin));
  return {cur:RATES.cur,materials:Math.round(materials),edging:Math.round(edging),
    hardware:Math.round(hardware),labour:Math.round(labour),cost:Math.round(cost),
    margin:total-Math.round(cost),total,sheets,area:+area.toFixed(2)};
}

/* ── drawing conventions borrowed from the references ──────── */
/* AWI: a dashed V whose apex is the hinge side. Tells the worker which
   way the door opens without a word of text. */
function swingMark(x,y,w,h,hingeLeft){
  const ax=hingeLeft?x:x+w, ay=y+h/2, o=hingeLeft?x+w:x;
  return `<path d="M${o},${y} L${ax},${ay} L${o},${y+h}" fill="none" stroke="${GREY}"
    stroke-width="${LW}" stroke-dasharray="1.4 1.1"/>`;
}
/* AWI: fronts carry the grain so nobody cuts one rotated */
function grainHatch(x,y,w,h,on){
  if(!on)return'';
  let g='';const n=Math.max(2,Math.round(w/7));
  for(let i=1;i<n;i++){const gx=x+w*i/n;
    g+=`<path d="M${gx},${y+1} Q${gx+.8},${y+h*.3} ${gx},${y+h*.5} Q${gx-.8},${y+h*.75} ${gx},${y+h-1}"
      fill="none" stroke="${GREY}" stroke-width=".1"/>`;}
  return g;
}
/* the reference wardrobes dimension every compartment. This is what gets built. */
function interiorDims(bays,x0,label){
  let g='';
  for(const b of bays){
    for(let i=0;i<b.ys.length-1;i++){
      const t=b.ys[i],q=b.ys[i+1],gap=q-t;
      if(gap<7)continue;
      const x=b.cx;
      g+=`<line x1="${x}" y1="${t+.6}" x2="${x}" y2="${q-.6}" stroke="${GREY}" stroke-width="${LW}"/>`
       + arrow(x,t+.6,0,-1)+arrow(x,q-.6,0,1);
      g+=`<rect x="${x-4.6}" y="${(t+q)/2-2}" width="9.2" height="4" fill="#fff" opacity=".92"/>`;
      g+=`<text x="${x}" y="${(t+q)/2+1.2}" font-family="${TEC}" font-style="italic" font-size="3.3" fill="${INK}"
        text-anchor="middle">${label(gap)}</text>`;
    }
  }
  return g;
}
/* AWI title: circled number, name, rule, scale beneath */
function awiTitle(x,y,n,txt,scaleTxt,w){

/* ═══════════════════════════════════════════════════════════════
   3D — cabinet oblique, drawn as PANELS not as boxes.

   Diagnosis of the previous version: it drew every part as a closed
   solid — 3 filled faces, 12 outlined edges. An 18 mm panel at 1:13
   is 1.4 mm on paper, so each shelf contributed 8 hairlines around a
   sliver 1.4 mm wide. 445 polygons, 1780 edges. The reference
   wardrobe drawings represent the same shelf with FOUR lines.

   Fix: a panel is drawn as its visible face plus a single thickness
   edge. Carcass outline heavy, internal panels light, nothing else.
   ═══════════════════════════════════════════════════════════════ */
const OBK=.5, OBC=Math.cos(Math.PI/4)*OBK, OBS=Math.sin(Math.PI/4)*OBK;
const P3=(x,y,z)=>[x+z*OBC, y-z*OBS];
const PTS=a=>a.map(q=>q[0].toFixed(2)+','+q[1].toFixed(2)).join(' ');
const SURF={face:'#FFFFFF',edge:'#E8E8E4',inner:'#F7F7F5',front:'#F2F2EF',filler:'#F4E4D2'};

/* which way does this part face? the thin axis decides how it is drawn */
function panelKind(b){
  const m=Math.min(b.w,b.h,b.d);
  return m===b.h?'horizontal':(m===b.w?'vertical':'flat');
}
function drawPanel(b,o,ox,oy,sc,opt){
  const T=(x,y,z)=>{const q=P3(x,y,z);return[ox+q[0]*sc,oy+q[1]*sc];};
  const kind=panelKind(b);
  const heavy=opt.heavy?LWB:LW;
  let g='';
  if(kind==='horizontal'){
    /* a shelf: show its TOP surface — the plane you actually see */
    const A=T(b.x,b.y,b.z),B=T(b.x+b.w,b.y,b.z),
          C=T(b.x+b.w,b.y,b.z+b.d),D=T(b.x,b.y,b.z+b.d);
    g+=`<polygon points="${PTS([A,B,C,D])}" fill="${SURF.inner}" stroke="${INK}" stroke-width="${LW}" stroke-linejoin="round"/>`;
    /* single front edge showing thickness */
    const E=T(b.x,b.y+b.h,b.z),F2=T(b.x+b.w,b.y+b.h,b.z);
    g+=`<polygon points="${PTS([A,B,F2,E])}" fill="${SURF.edge}" stroke="${INK}" stroke-width="${LW}" stroke-linejoin="round"/>`;
  }else if(kind==='vertical'){
    /* a side or divider: show its INNER face */
    const A=T(b.x,b.y,b.z),B=T(b.x,b.y+b.h,b.z),
          C=T(b.x,b.y+b.h,b.z+b.d),D=T(b.x,b.y,b.z+b.d);
    g+=`<polygon points="${PTS([A,B,C,D])}" fill="${SURF.inner}" stroke="${INK}" stroke-width="${heavy}" stroke-linejoin="round"/>`;
    const E=T(b.x+b.w,b.y,b.z),F2=T(b.x+b.w,b.y+b.h,b.z);
    g+=`<polygon points="${PTS([A,E,F2,B])}" fill="${SURF.edge}" stroke="${INK}" stroke-width="${LW}" stroke-linejoin="round"/>`;
  }else{
    /* a front, back or drawer face: true-shape rectangle, no depth at all */
    const A=T(b.x,b.y,b.z),B=T(b.x+b.w,b.y,b.z),
          C=T(b.x+b.w,b.y+b.h,b.z),D=T(b.x,b.y+b.h,b.z);
    g+=`<polygon points="${PTS([A,B,C,D])}" fill="${opt.fill||SURF.front}" stroke="${INK}"
        stroke-width="${heavy}" stroke-linejoin="round"/>`;
  }
  return g;
}
function buildItems(res,fit,explode,hideFronts){

/* ── 3. bevelled edges ────────────────────────────────────────
   Every real panel carries a 1–2 mm radius that runs a highlight
   down its length. Mathematically sharp boxes are the classic
   "this is CG" tell. Corner vertices are pushed out to a radius. */
function roundedBox(w,h,d,r,seg){
  const T3=THREE;
  r=Math.max(.4,Math.min(r,Math.min(w,h,d)/2.6));

  const pos=g.attributes.position, v=new T3.Vector3(), c=new T3.Vector3();
  const hx=w/2-r, hy=h/2-r, hz=d/2-r;
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i);
    c.set(Math.max(-hx,Math.min(hx,v.x)),Math.max(-hy,Math.min(hy,v.y)),
          Math.max(-hz,Math.min(hz,v.z)));

    v.multiplyScalar(r/L).add(c);
    pos.setXYZ(i,v.x,v.y,v.z);

/* ── 4. materials with variation, not one flat number ───────── */
function grainCanvas(hex,strong,forRough){
  const c=document.createElement('canvas');c.width=c.height=1024;
  const x=c.getContext('2d');
  x.fillStyle=forRough?'#8a8a8a':hex; x.fillRect(0,0,1024,1024);
  for(let i=0;i<260;i++){
    const y=Math.random()*1024, w=.5+Math.random()*3.2;
    const a=(strong?.13:.05)*Math.random();
    x.strokeStyle=forRough?`rgba(255,255,255,${a*2.2})`:`rgba(0,0,0,${a})`;
    x.lineWidth=w; x.beginPath();
    for(let px=0;px<=1024;px+=12)
      x.lineTo(px,y+Math.sin(px/120+i)*(strong?13:5)+Math.sin(px/27+i*1.7)*2.2);
    x.stroke();
  }
  for(let i=0;i<9;i++){                       /* knots and cathedral figure */
    const kx=Math.random()*1024,ky=Math.random()*1024,rr=18+Math.random()*46;
    const gr=x.createRadialGradient(kx,ky,2,kx,ky,rr);
    gr.addColorStop(0,forRough?'rgba(255,255,255,.30)':'rgba(0,0,0,.20)');
    gr.addColorStop(1,'rgba(0,0,0,0)');

}

/* ── 1. image-based lighting, built procedurally ──────────────

  g.addColorStop(.72,'#9aa0a6'); g.addColorStop(1,'#4a4d51');

function mountRealistic(res,fit,cfg){

                    user can make. It never feeds the cut list.
   The key is kept in this browser (localStorage); in development it may also

const AI={

function responseText(d){
  if(typeof d.output_text==='string'&&d.output_text)return d.output_text;
  for(const item of (d.output||[]))for(const part of (item.content||[]))
    if(part.type==='output_text'&&typeof part.text==='string')return part.text;
  throw new Error('empty-response');
}
async function callVisionJSON(prompt,schema,name,b64,mime,maxTokens){

  try{
    const r=await fetch('https://api.openai.com/v1/responses',{method:'POST',signal:ac.signal,
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+AI.getKey()},
      body:JSON.stringify({model:AI.model.vision,store:false,max_output_tokens:maxTokens||5000,
        input:[{role:'user',content:[
          {type:'input_text',text:prompt},
          {type:'input_image',image_url:'data:'+mime+';base64,'+b64,detail:'high'}]}],
        text:{format:{type:'json_schema',name,strict:true,schema}}})});

    (v[0]*(s[1].x*s[2].y-s[2].x*s[1].y)+v[1]*(s[2].x*s[0].y-s[0].x*s[2].y)+v[2]*(s[0].x*s[1].y-s[1].x*s[0].y))/den];

    let model=await callVisionJSON(prompt,MODEL_SCHEMA,'furniture_reconstruction',board.b64,board.mime,7500);
    if(categoryHint)model.category=categoryHint;
    const needsAudit=evidence.cameraView!=='frontal'||(evidence.ignoredObjects||[]).length>=4||evidence.columns.some(c=>c.dividerStart>0||c.dividerEnd<1);
    let audit=null;
    if(needsAudit){
      try{
        const auditBoard=await makeAuditBoard(b64,mime,evidence,model);
        audit=await callVisionJSON(AUDIT_PROMPT,AUDIT_SCHEMA,'furniture_visual_audit',auditBoard.b64,auditBoard.mime,3000);
        const critical=(audit.issues||[]).filter(q=>q.critical).map(q=>q.message);
        if(!audit.accepted||audit.status==='reject'||critical.length){
          const proposed=model,fromEvidence=modelFromEvidence(evidence);
          if(audit.rootBayCount===evidence.rootBayCount&&audit.drawerFronts===evidence.totalDrawerFronts)model=fromEvidence;
          else model.recognitionStatus='needs_review';
          model.warnings=[...(model.warnings||[]),...critical,...(audit.issues||[]).filter(q=>!q.critical).map(q=>q.message),
            ...(model===fromEvidence?['Final visual audit rejected the reconstruction; evidence model restored.']:[])];
          if(model===fromEvidence)model.warnings.push('Rejected proposal: '+(proposed.observations||''));
        }else if(audit.status==='needs_review')model.recognitionStatus='needs_review';
      }catch(err){model.recognitionStatus='needs_review';model.warnings.push('Final visual audit failed: '+err.message);}
    }
    return {evidence,model,audit};
  }catch(err){
    const model=modelFromEvidence(evidence);
    model.warnings.push('Second review pass failed: '+err.message);
    return {evidence,model};
  }
}

/* coarse plain-English colour name from a hex, so the prompt states both */
function colourName(hex){
  const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||'');
  if(!m)return'';
  const r=parseInt(m[1],16),g=parseInt(m[2],16),b=parseInt(m[3],16);
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/510,d=mx-mn;
  if(d<18)return l>0.82?'near-white':l>0.55?'light grey':l>0.3?'mid grey':l>0.09?'charcoal':'near-black';
  let h;
  if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4;
  h=(h*60+360)%360;
  const base=[[16,'red'],[45,'orange'],[68,'yellow'],[95,'lime'],[165,'green'],[200,'teal'],[255,'blue'],[290,'violet'],[335,'magenta'],[360,'red']].find(n=>h<=n[0])[1];
  return (l>0.7?'pale ':l<0.32?'deep ':'')+base;
}

/* ── STEP 1 · READ THE CONSTRUCTION DRAWING ────────────────────────────
   The drawing is made first, from `res.parts`. readDrawing() re-reads that
   same resolved geometry — plus the title-block finish specs and the cut-
   list schedule — into ONE machine-readable spec: every section, every
   front, its exact mm size and its exact height above the floor, its
   handle, the plinth, the material. Nothing inferred, nothing from an
   earlier guess. This object is logged (window.VAN.drawingSpec), not shown
   in the UI, and it is the ONLY input to the image prompt. */
function readDrawing(cfg,fit,res){
  const M=t=>Math.round(t/10);                       /* tenths-mm → whole mm */
  const EN=I18N.en, W=M(fit.W),H=M(fit.H),D=M(fit.D), t=M(R.panelT);
  if(res.kitchen)return {kind:'kitchen',overall:{w:W,h:H,d:D,scribeEachSide:M(fit.scribe)},
    units:res.units.map((u,i)=>({n:i+1,type:u.type,label:EN.kitchenTypes[u.type],x:M(u.x),width:M(u.w)})),
    wallUnits:!!cfg.kitchen.wallUnits,baseHeight:M(res.baseH),wallHeight:M(res.wallH),wallDepth:M(res.wallD),wallGap:M(res.gap),worktopHeight:H-M(res.yWork),worktopThickness:M(res.worktopT),worktopOverhang:M(res.worktopOverhang),
    appliances:res.appliances.map(a=>a.type),cutouts:res.cutouts.map(c=>c.type),plinth:cfg.plinth?{height:M(res.plinthH),setback:M(res.plinthSetback)}:null,
    finish:{style:cfg.frontStyle||'flat',styleLabel:EN.styles[cfg.frontStyle||'flat']||'Flat slab',material:cfg.material||'laminate',materialLabel:EN.materials[cfg.material||'laminate'],finish:cfg.finish||'matt',finishLabel:EN.finishes[cfg.finish||'matt'],colourHex:(cfg.colour||'#EAE6DF').toUpperCase(),colourName:colourName(cfg.colour)},
    handles:{type:cfg.handles||'grooved',label:EN.handles[cfg.handles||'grooved']},schedule:compactCutParts(res).map((p,i)=>({n:i+1,part:EN.parts[p.k]||p.k,qty:p.q,cutL:M(p.cl),cutW:M(p.cw),thk:M(p.th)})),sheetSize:SH(cfg).n,title:{number:PROJ.number,rev:PROJ.rev,date:PROJ.date}};
  if(res.bathroom)return {kind:'bathroom',overall:{w:W,h:H,d:D,scribeEachSide:M(fit.scribe)},mount:res.mount,floorClearance:M(res.floorClearance),
    basinType:res.bathroomModel.basinType,basins:res.basins.map(b=>({centreFromLeft:M(b.cx),width:M(b.w),depth:M(b.d),height:M(b.h)})),tapMount:res.bathroomModel.tapMount,
    fronts:res.parts.filter(p=>p.k==='drawerfront'||p.k==='door').map(p=>({type:p.k,count:p.q,width:M(p.fw),height:M(p.fl)})),
    worktop:{thickness:M(res.worktopT),overhang:M(res.worktopOverhang),cutouts:res.cutouts.map(c=>({type:c.type,x:M(c.x),z:M(c.z||0),width:M(c.w),depth:M(c.d) }))},
    plumbingVoids:res.plumbingVoids.map(v=>({centreFromLeft:M(v.cx),width:M(v.w),height:M(v.h),depth:M(v.d)})),plumbingNotches:res.plumbingNotches,
    services:res.services.map(q=>({hotX:M(q.hotX),coldX:M(q.coldX),wasteX:M(q.wasteX),height:M(q.height),wasteDiameter:M(q.wasteD)})),
    finish:{style:cfg.frontStyle||'flat',styleLabel:EN.styles[cfg.frontStyle||'flat']||'Flat slab',material:cfg.material||'laminate',materialLabel:EN.materials[cfg.material||'laminate'],finish:cfg.finish||'matt',finishLabel:EN.finishes[cfg.finish||'matt'],colourHex:(cfg.colour||'#EAE6DF').toUpperCase(),colourName:colourName(cfg.colour)},
    handles:{type:cfg.handles||'grooved',label:EN.handles[cfg.handles||'grooved']},schedule:cutParts(res).map((p,i)=>({n:i+1,part:EN.parts[p.k]||p.k,qty:p.q,cutL:M(p.cl),cutW:M(p.cw),thk:M(p.th),notches:(p.notches||[]).length})),sheetSize:SH(cfg).n,title:{number:PROJ.number,rev:PROJ.rev,date:PROJ.date}};
  const dvx=(res.parts.find(p=>p.k==='divider')||{boxes:[]}).boxes.map(b=>M(b.x));
  const cols=(cfg.columns&&cfg.columns.length)?cfg.columns:[{zones:cfg.zones||[]}];
  const partFor=(k,ci,zi)=>res.parts.find(x=>x.k===k&&(x.col||0)===ci&&(x.zi==null||x.zi===zi));
  const plinthP=res.parts.find(p=>p.k==='plinth');
  const plinthH=plinthP?M(plinthP.boxes[0].h):0;

  const sections=cols.map((colc,ci)=>{
    const pf=res.planner&&res.frames[ci],secH=pf?M(pf.h):H;
    const xL=pf?M(pf.x)+t:(ci===0?t:dvx[ci-1]+t), xR=pf?M(pf.x)+M(pf.w)-t:(ci<dvx.length?dvx[ci]:W-t);
    const zones=(colc.zones||[]).filter(z=>['doors','drawers','open'].includes(z.type));
    const bands=zones.map((z,zi)=>{
      if(z.type==='doors'){
        const p=partFor('door',ci,zi), b=p&&p.boxes[0];
        const topFromTop=b?M(b.y)-(pf?M(pf.y||0):0):0, hgt=b?M(b.h):0;
        return {type:'doors', count:p?p.q:(z.count||2), eachW:p?M(p.fw):0, eachH:hgt,
          topAboveFloor:secH-topFromTop, bottomAboveFloor:secH-topFromTop-hgt,
          pair:(p?p.q:z.count)===2, internalShelves:z.shelves||0};
      }
      if(z.type==='drawers'){
        const p=partFor('drawerfront',ci,zi), bx=p?p.boxes:[];
        const heights=(p&&Array.isArray(p.varied))?p.varied.map(M):bx.map(b=>M(b.h));
        const yOff=pf?M(pf.y||0):0,top=bx.length?M(bx[0].y)-yOff:0, bot=bx.length?M(bx[bx.length-1].y)-yOff+M(bx[bx.length-1].h):0;
        return {type:'drawers', count:p?p.q:(z.count||3), eachW:p?M(p.fw):0, heights,
          gap:M(R.frontStackGap), topAboveFloor:secH-top, bottomAboveFloor:secH-bot};
      }
      const sh=res.parts.filter(x=>x.k==='shelf'&&(x.col||0)===ci);
      /* a rail is only ever fitted in an 'open' or 'doors' zone (see
         generateCabinet's wantsRail check) — inside a doors zone it is
         hidden behind the closed front and must never be mentioned to the
         image model (see the doors band below); inside an open zone it is
         genuinely visible, so it belongs on THIS band, not as a cabinet-wide
         fact with no section of its own. */
      return {type:'open', shelves:z.shelves||sh.reduce((a,x)=>a+x.boxes.length,0)||1, rail:!!z.rail};
    });
    return {n:ci+1, xLeft:xL-t, width:pf?M(pf.w):xR-xL,height:secH,depth:pf?M(pf.d):D,bands,
      exteriorFront:pf?{type:pf.front||'none',handle:pf.handle||'none'}:null};
  });

  return {
    overall:{w:W,h:H,d:D,scribeEachSide:M(fit.scribe)},
    carcassPanel:t, revealGap:2,
    sectionGap:res.planner?0:(cols.length>1?t:0),
    sections,
    plinth: cfg.plinth?{height:plinthH||M(R.plinthH), setback:M(R.plinthSetback)}:null,
    railDiameter:M(R.railDia),   /* which band(s) actually carry a rail is on that band's own `rail` flag, not a cabinet-wide fact */
    finish:{
      style:cfg.frontStyle||'flat',
      styleLabel:(EN.styles[cfg.frontStyle||'flat']||'Flat slab'),
      material:cfg.material||'laminate',
      materialLabel:EN.materials[cfg.material||'laminate'],
      finish:cfg.finish||'matt',
      finishLabel:EN.finishes[cfg.finish||'matt'],
      colourHex:(cfg.colour||'#EAE6DF').toUpperCase(),
      colourName:colourName(cfg.colour)
    },
    handles:{type:cfg.handles||'bar', label:EN.handles[cfg.handles||'bar']},
    schedule:cutParts(res).map((p,i)=>({n:i+1,part:EN.parts[p.k]||p.k,qty:p.q,
      cutL:M(p.cl),cutW:M(p.cw),thk:M(p.th)})),
    sheetSize:SH(cfg).n,
    title:{number:PROJ.number,rev:PROJ.rev,date:PROJ.date}
  };
}

/* ── STEP 2 · PROMPT THE IMAGE AI FROM THAT SPEC ──────────────────────
   Pure function of the spec — turns it into one concrete, literal
   description. Positions are given as "mm above the floor" so the model
   cannot rearrange the stack. */
function describeDrawing(s){
  const styleTxt={
    flat:'flat slab fronts (no frame, no moulding, dead flat)',
    shaker:'shaker fronts — a recessed flat centre panel inside a ~60 mm square frame',
    panelled:'panelled fronts — a raised centre panel inside a moulded frame',
    reeded:'reeded fronts — vertical fluting running top to bottom',
    glazed:'glazed fronts — a glass pane in a slim frame'
  }[s.finish.style]||'flat slab fronts';
  const isBar=s.handles.type==='bar', isKnob=s.handles.type==='knob';
  const noHandle=s.handles.type==='none'||s.handles.type==='grooved';
  const doorH=noHandle?(s.handles.type==='grooved'?'no handle — a continuous finger shadow-gap along the top edge':'no handle — plain push-to-open')
    :`a ${isBar?'vertical bar handle':isKnob?'round knob':'handle'} mounted near its opening (meeting) edge, about 1000 mm above the floor`;
  const drawerH=noHandle?(s.handles.type==='grooved'?'a shadow-gap along the top edge':'no handle')
    :`a ${isBar?'horizontal bar handle':isKnob?'round knob':'handle'} centred on the front`;

  if(s.kind==='kitchen')return [
    `CONSTRUCTION DRAWING — build this straight kitchen run exactly. Overall wall ${s.overall.w} mm wide × ${s.overall.h} mm high; cabinet depth ${s.overall.d} mm.`,
    `LEFT → RIGHT module order: ${s.units.map(u=>`${u.n}. ${u.label}, ${u.width} mm wide`).join(' · ')}. Keep this order and these widths.`,
    `Base carcasses are ${s.baseHeight} mm high. The finished worktop is ${s.worktopHeight} mm above the floor, with a ${s.worktopThickness} mm top and ${s.worktopOverhang} mm overhang.${s.wallUnits?` Matching wall cabinets are ${s.wallHeight} mm high, ${s.wallDepth} mm deep and ${s.wallGap} mm above the worktop, except above the oven/hob and tall units.`:' There are no wall cabinets.'}`,
    `Appliances visible in the run: ${s.appliances.length?s.appliances.join(', '):'none'}. Worktop cut-outs: ${s.cutouts.length?s.cutouts.join(', '):'none'}.`,
    s.plinth?`A recessed ${s.plinth.height} mm plinth runs below each uninterrupted base-cabinet group.`:'No plinth.',
    `MATERIAL: ${styleTxt}, ${s.finish.materialLabel.toLowerCase()}, ${s.finish.finishLabel.toLowerCase()}, colour ${s.finish.colourName} ${s.finish.colourHex}. Handles: ${s.handles.label}.`,
    `Show the complete kitchen square to camera. Do not add an island, corner, window, props, additional cabinets or appliances.`
  ].join('\n');
  if(s.kind==='bathroom')return [
    `CONSTRUCTION DRAWING — build this bathroom vanity exactly. Cabinet ${s.overall.w} mm wide × ${s.overall.h} mm high × ${s.overall.d} mm deep; ${s.mount==='wall'?`wall hung with ${s.floorClearance} mm clear above the floor`:'floor standing'}.`,
    `${s.basins.length} ${s.basinType==='vessel'?'countertop vessel':'integrated'} basin${s.basins.length===1?'':'s'}: ${s.basins.map((b,i)=>`${i+1}. centre ${b.centreFromLeft} mm from left, ${b.width} × ${b.depth} × ${b.height} mm`).join(' · ')}.`,
    `Front layout: ${s.fronts.map(f=>`${f.count} ${f.type==='drawerfront'?'drawer front':'door'}${f.count===1?'':'s'}, each ${f.width} × ${f.height} mm`).join(' · ')}.`,
    `Worktop is ${s.worktop.thickness} mm thick with ${s.worktop.overhang} mm overhang. Cut-outs: ${s.worktop.cutouts.map(c=>`${c.type} ${c.width} × ${c.depth} mm at x=${c.x}, z=${c.z}`).join(' · ')||'none'}. Tap: ${s.tapMount} mounted.`,
    `Keep the marked plumbing voids completely clear for hot water, cold water and waste. The drawer manufacture includes ${s.plumbingNotches} siphon-clearance operation${s.plumbingNotches===1?'':'s'}.`,
    `MATERIAL: ${styleTxt}, ${s.finish.materialLabel.toLowerCase()}, ${s.finish.finishLabel.toLowerCase()}, colour ${s.finish.colourName} ${s.finish.colourHex}. Handles: ${s.handles.label}.`,
    `Show the complete vanity square to camera. Do not add a bathtub, shower, toilet, tall cabinet, props or extra basins.`
  ].join('\n');

  const bandNoun={doors:'doors',drawers:'drawer fronts',open:'open compartment'};
  const secLines=s.sections.map(sec=>{
    const nb=sec.bands.length;
    const order=sec.bands.map(b=>b.type==='drawers'?`${b.count} drawers`:b.type==='doors'?`${b.count} ${b.count===1?'door':'doors'}`:'an open shelf bay').join(' · then below · ');
    const parts=[
      `SECTION ${sec.n}${s.sections.length>1?` of ${s.sections.length}`:''} — ${sec.width} mm wide${sec.height?` × ${sec.height} mm high × ${sec.depth} mm deep`:''}.`,
      `  Vertical order in this section, TOP → BOTTOM: ${order}${s.plinth?' · then the plinth':''}.`
    ];
    if(sec.exteriorFront&&sec.exteriorFront.type!=='none')parts.push(`  An exterior ${sec.exteriorFront.type==='sliding'?'sliding front':'hinged door front'} covers this whole section; handle type ${sec.exteriorFront.handle}. The interior remains exactly as listed below.`);
    sec.bands.forEach((b,bi)=>{
      const pos=nb===1?'The whole section':bi===0?'TOP band':bi===nb-1?'BOTTOM band (just above the plinth)':`band ${bi+1} from the top`;
      const range=`(${b.type==='open'?'':`${b.bottomAboveFloor}–${b.topAboveFloor} mm above the floor, ${b.topAboveFloor-b.bottomAboveFloor} mm tall — `}`;
      if(b.type==='doors'){
        /* whatever is behind a closed door (shelves, a rail, anything) is
           invisible from outside — say so explicitly, in the same sentence,
           instead of naming it and trusting the model not to draw it. This
           is the exact failure reported: an internal shelf/rail behind a
           closed door came out as a visible open shelf with the door gone. */
        const hidden=b.internalShelves?` (hidden — ${b.internalShelves} fixed shelf inside, behind the closed door, NOT visible)`:'';
        parts.push(`  · ${pos}: ${range}${b.count===1?'1 hinged door':b.pair?'2 hinged doors meeting at the section centre':b.count+' hinged doors side by side'}, each ${b.eachW} mm wide × ${b.eachH} mm tall). Each has ${doorH}. The door is a solid, opaque, CLOSED front — nothing behind it is visible${hidden}.`);
      }else if(b.type==='drawers'){
        parts.push(`  · ${pos}: ${range}${b.count} drawer fronts in a vertical stack, each ${b.eachW} mm wide; heights top-to-bottom ${b.heights.join(' / ')} mm; ${b.gap} mm gap between fronts). Each has ${drawerH}. Only the drawer fronts are visible — no open box, no interior.`);
      }else{
        parts.push(`  · ${pos}: an OPEN compartment, no front — the plain carcass interior IS visible here, ${b.shelves} fixed ${b.shelves>1?'shelves':'shelf'} evenly spaced.${b.rail?' A round metal clothes rail runs near the top of this compartment, visible.':''}`);
      }
    });
    return parts.join('\n');
  });

  const orderAll=s.sections.map(sec=>`S${sec.n}: ${sec.bands.map(b=>b.type).join(' over ')}`).join(' | ');
  return [
`CONSTRUCTION DRAWING — build the picture from this exactly. Do not add, remove, merge, resize or rearrange any element, and keep every band in the exact top-to-bottom order given.`,
`Overall carcass ${s.overall.w} mm wide × ${s.overall.h} mm tall × ${s.overall.d} mm deep, standing on the floor.`,
s.sections.length>1
  ? `The front face has ${s.sections.length} vertical sections side by side (widths ${s.sections.map(x=>x.width).join(' / ')} mm), each separated by a ${s.sectionGap} mm carcass upright.`
  : `The front face is one bay ${s.sections[0].width} mm wide.`,
`Top-to-bottom band order (obey this — it is often not the usual layout): ${orderAll}.`,
...secLines,
s.plinth?`A recessed plinth ${s.plinth.height} mm tall runs along the whole floor, set back ${s.plinth.setback} mm so the lowest fronts overhang it.`:`No plinth — the lowest fronts run to the floor.`,
`Every front is set into the carcass with a uniform ${s.revealGap} mm shadow-gap reveal on all four sides. The carcass shows a ${s.carcassPanel} mm edge around the whole opening.`,
`MATERIAL: ${styleTxt}, in ${s.finish.materialLabel.toLowerCase()}, ${s.finish.finishLabel.toLowerCase()} finish, colour ${s.finish.colourName} ${s.finish.colourHex}. The carcass, edges and interior are the same colour. ${isBar||isKnob?`Handles are brushed steel.`:''}`,
/* explicit "forbidden changes" list — every one of these is a real failure
   mode already seen from this model: a closed section rendered open with
   its hidden interior exposed, a rail or shelf moved to a section that
   never had it, sections re-ordered or mirrored, symmetry added where the
   drawing is deliberately asymmetric. */
`Do not remove a door to reveal what is behind it. Do not turn a closed section into an open one. Do not move a shelf, rail, drawer or door from the section it is listed under to any other section. Do not reorder or mirror the sections. Do not add shelves, rails, drawers, doors, handles, glazing, legs or symmetry that is not explicitly listed above — an asymmetric layout stays asymmetric. Nothing else: only what is named above.`
  ].filter(Boolean).join('\n');
}

/* STEP 1 → STEP 2, with the studio-photo framing around it. */
/* A clean, dimension-free front view for the AI reference image — no A3
   sheet, no title block, no dimension chains, no balloons, no swing arcs:
   just the fills, grain and handles, exactly the geometry a photo would
   show, straight off the SAME res.parts the drawing and schedule come from
   (§3). Sending the model a picture of the actual layout, not only a text
   description of it, is what the "det skal have selve tegningen, ikke kun
   tekst" request asks for — OpenAI's own guidance is that a pure-text
   prompt cannot guarantee millimetre-exact placement in a composition this
   structured; an image reference plus the literal text is measurably more
   reliable, and is still verified afterwards against the same res.parts
   (§3) rather than trusted blind. */
function frontPreviewSVG(res,fit,cfg){
  let lo=0,hi=mmv(fit.W);
  for(const p of res.parts)for(const b of p.boxes){
    const a=mmv(b.x),w=mmv(b.w); lo=Math.min(lo,a); hi=Math.max(hi,a+w);
  }
  const ch=mmv(fit.H), cw=hi-lo, pad=Math.max(cw,ch)*.06;
  const vw=cw+2*pad, vh=ch+2*pad;
  const X=v=>mmv(v)-lo+pad, Y=v=>mmv(v)+pad;
  const grained=(cfg.material==='veneer'||cfg.material==='solid');
  let g=`<rect x="0" y="0" width="${vw}" height="${vh}" fill="#F4F2EE"/>`;
  res.parts.forEach(p=>{
    p.boxes.forEach(b=>{
      const isFront=p.mat==='front'&&p.k!=='filler';
      const X0=X(b.x),Y0=Y(b.y),W0=mmv(b.w),H0=mmv(b.h);
      if(p.k==='rail')
        g+=`<rect x="${X0}" y="${Y0}" width="${W0}" height="${Math.max(H0,3)}" rx="${Math.max(H0,3)/2}" fill="#C9CDD0" stroke="${INK}" stroke-width=".6"/>`;
      else
        g+=`<rect x="${X0}" y="${Y0}" width="${W0}" height="${H0}" fill="${p.k==='filler'?'#F8EADB':(isFront?(res.colour||'#FBFBFA'):'#FFFFFF')}" stroke="${INK}" stroke-width=".6"/>`;
      if(isFront)g+=grainHatch(X0,Y0,W0,H0,grained);
      if(p.k==='door'||p.k==='drawerfront')g+=handleArt(b,p.k,res.handles,fit.W,X,Y,1);
    });
  });
  return `<svg viewBox="0 0 ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg" width="1024" height="${Math.max(1,Math.round(1024*vh/vw))}" style="background:#F4F2EE">${g}</svg>`;
}
/* Rasterize an SVG string to a PNG data URL via an offscreen canvas — the
   standard browser technique (Image src = data:image/svg+xml, then
   drawImage). Resolves to null (never rejects) on any failure OR if neither
   onload nor onerror ever fires within a few seconds, so a broken or stuck
   reference render degrades to the old text-only prompt instead of leaving
   "Generate" spinning forever with no way out (§5). */
function svgToPngDataURL(svg,pxW,pxH){
  return new Promise(resolve=>{
    let done=false;
    const finish=v=>{ if(done)return; done=true; clearTimeout(to); resolve(v); };
    const to=setTimeout(()=>finish(null),8000);
    try{
      const img=new Image();
      img.onload=()=>{
        try{
          const c=document.createElement('canvas'); c.width=pxW; c.height=pxH;
          const x=c.getContext('2d'); x.fillStyle='#F4F2EE'; x.fillRect(0,0,pxW,pxH);
          x.drawImage(img,0,0,pxW,pxH);
          finish(c.toDataURL('image/png'));
        }catch(e){finish(null);}
      };
      img.onerror=()=>finish(null);
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    }catch(e){finish(null);}
  });
}
/* ── STEP 1b (owner-specified) · an independent READING pass over the
   drawing image, before generation ─────────────────────────────────────
   readDrawing()/describeDrawing() above already build the image prompt
   straight from res.parts — the exact geometry the saw cuts (§3) — with
   zero uncertainty, since it is VAN's own drawing, not a photograph. What
   this adds, at the owner's explicit request and using the two prompts
   they supplied: an independent verification pass that reads the actual
   drawing IMAGE (not just the computed numbers) through the vision model,
   with the same computed data attached as the "structured model data" its
   own prompt expects, and returns one locked, literal construction spec —
   including an explicit visible/hidden split — that STEP 2 then renders
   from instead of re-deriving its own text. If this pass is unavailable
   or fails, STEP 2 falls back to describeDrawing()'s own text (unchanged
   from before) rather than blocking image generation entirely. */
const DRAWING_READ_SCHEMA={type:'object',additionalProperties:false,properties:{
  status:{type:'string',enum:['ready','needs_resolution']},
  overall_dimensions:{type:'object',additionalProperties:false,
    properties:{width_mm:{type:'number'},height_mm:{type:'number'},depth_mm:{type:'number'}},
    required:['width_mm','height_mm','depth_mm']},
  sections_left_to_right:{type:'array',items:{type:'object',additionalProperties:false,properties:{
    index:{type:'integer'},width_mm:{type:'number'},
    bands_top_to_bottom:{type:'array',items:{type:'object',additionalProperties:false,properties:{
      type:{type:'string',enum:['doors','drawers','open']},
      count:{type:'integer'},
      top_above_floor_mm:{type:'number'},bottom_above_floor_mm:{type:'number'},
      visible_from_outside:{type:'boolean'},
      hidden_contents:{type:'string'}},
      required:['type','count','top_above_floor_mm','bottom_above_floor_mm','visible_from_outside','hidden_contents']}}},
    required:['index','width_mm','bands_top_to_bottom']}},
  materials:{type:'object',additionalProperties:false,properties:{
    material:{type:'string'},finish:{type:'string'},colour_hex:{type:'string'},handle_type:{type:'string'}},
    required:['material','finish','colour_hex','handle_type']},
  counts_visible:{type:'object',additionalProperties:false,
    properties:{doors:{type:'integer'},drawer_fronts:{type:'integer'},open_shelves:{type:'integer'}},
    required:['doors','drawer_fronts','open_shelves']},
  counts_hidden:{type:'object',additionalProperties:false,
    properties:{shelves:{type:'integer'},rails:{type:'integer'}},required:['shelves','rails']},
  render_description:{type:'string'},
  forbidden_changes:{type:'array',items:{type:'string'}},
  uncertainties:{type:'array',items:{type:'string'}},
  conflicts:{type:'array',items:{type:'string'}}},
  required:['status','overall_dimensions','sections_left_to_right','materials','counts_visible','counts_hidden',
    'render_description','forbidden_changes','uncertainties','conflicts']};
const DRAWING_READ_PROMPT=`You are a technical furniture constructor. Your task is to describe the EXISTING construction precisely, for a visualization made afterwards. You must not design, improve or rearrange the furniture.

SOURCES AND UNCERTAINTY
Use the attached structured model data (given below as JSON) as the source for dimensions and part placement — it comes from the exact same revision as the drawing image.
Use the drawing image to verify the visible structure and confirm nothing was lost in translation.
Use the material specification (also below) for surfaces and colours.
If the drawing and the structured data conflict, record the conflict explicitly — do not silently pick whichever seems more plausible.
Never derive an exact millimetre dimension from the image's pixels alone; the structured data is authoritative for numbers.

COORDINATES
Left and right are as seen by a viewer standing in front of the piece.
Number sections S1, S2, S3… left to right.
Describe each section's bands top to bottom, and give each band's top and bottom position as millimetres above the floor, so the order can never be misread.

VISIBILITY IS DECISIVE
Separate, for every part:
A. Exterior parts, visible from outside.
B. Parts visible through a genuinely open compartment.
C. Interior parts hidden behind a closed front.
A drawer behind a closed door is NOT a visible drawer front. A shelf behind a closed door must NOT become an open shelf. A rail behind a closed door must NOT cause the door to be removed or the section to be drawn as open. Preserve exactly the open/closed state the drawing shows for every front.

OUTPUT
Return only the structured JSON object matching the given schema.
render_description must be one concrete, literal description: first the whole piece, then each section left to right, and within each section each band top to bottom — precisely what is visible, what is hidden, and what sits above, below and beside what. This is the text the image generator will render from, so state it as an instruction, not a caption.
forbidden_changes must list, as plain sentences, the specific mistakes a naive image generator is likely to make on THIS construction (for example: do not remove the doors on section 2, do not add a rail to the closed section, do not mirror the run) — not a generic boilerplate list.

CHECK
Cross-check every count, dimension, position and visibility claim against the structured model data before answering. If anything about construction, fronts or materials could not be resolved, set status to "needs_resolution" and list it in conflicts or uncertainties rather than guessing.`;

async function readDrawingViaVision(res,fit,cfg,drawingPngDataURL){
  const spec=readDrawing(cfg,fit,res);
  const structured=JSON.stringify(spec);
  const prompt=DRAWING_READ_PROMPT+'\n\nSTRUCTURED MODEL DATA (same revision as the attached drawing):\n'+structured;
  const b64=drawingPngDataURL.split(',')[1];
  return callVisionJSON(prompt,DRAWING_READ_SCHEMA,'drawing_reading',b64,'image/png',4000);
}
function buildImagePromptFromReading(reading,hasReference){
  return [
    `Photorealistic straight-on studio product photograph, square to camera, whole piece centred and entirely in frame with no cropping of the top, sides or plinth, parallel vertical lines with minimal perspective distortion, on a seamless pale-grey background with soft neutral lighting that reads the material colours correctly and a faint contact shadow. No people, no props, no text, no dimension lines.`,
    hasReference?`The attached reference images are a clean front view and the annotated technical drawing of this exact, FIXED construction — the section order, band layout and every front's position and size are locked. Match them exactly; ignore the technical drawing's dimension lines, balloons and title block, they are annotations only, not physical parts.`:'',
    `CONSTRUCTION SPECIFICATION — this is a visualization of a fixed, already-decided construction. Counts, positions and proportions are locked.\n${reading.render_description}`,
    reading.forbidden_changes&&reading.forbidden_changes.length?`Do not: ${reading.forbidden_changes.join(' ')}`:'',
    `Hidden parts stay hidden: never show an internal drawer as an external drawer front, never remove a door to reveal shelves, a rail or lighting behind it. Do not add symmetry, extra shelves, drawers, handles or panels. Do not move a part between sections. Do not mirror the piece. Do not turn a door into a drawer or an open compartment.`,
    `MATERIAL: ${reading.materials.material}, ${reading.materials.finish} finish, colour ${reading.materials.colour_hex}. Handles: ${reading.materials.handle_type}. Apply it to the correct parts only; do not draw grain on a specified plain lacquered front.`,
    `Remove only technical annotations: dimension lines, text, part numbers, opening diagonals and guide lines must not appear in the final image. Physical edges, joints, reveals and handles must be preserved.`,
    `Render as a clean catalogue photo of the finished piece. Customer illustration — not to scale, not a production drawing.`
  ].filter(Boolean).join('\n\n');
}

function buildImagePrompt(cfg,fit,res,hasReference){
  const kind=((cfg.subject||'').replace(/-/g,' ').trim())||'fitted cabinet';
  const spec=readDrawing(cfg,fit,res);
  return [
    `Photorealistic straight-on studio product photograph of one built-in ${kind}, square to camera, whole piece centred and entirely in frame with no cropping of the top, sides or plinth, parallel vertical lines with minimal perspective distortion, on a seamless pale-grey background with soft neutral lighting that reads the material colours correctly and a faint contact shadow. No people, no props, no text, no dimension lines.`,
    hasReference?`The attached reference image is a clean, literal front view of this exact construction — the same section order, the same band layout top to bottom in every section, and the same front/handle positions. Match it exactly; do not treat it as a style reference to reinterpret, and do not copy its flat, undecorated rendering style — render photorealistic materials, lighting and shadow instead.`:'',
    describeDrawing(spec),
    `Render as a clean catalogue photo of the finished piece. Customer illustration — not to scale, not a production drawing.`
  ].filter(Boolean).join('\n\n');
}

async function aiRenderImage(prompt,hiQ,W,H,refPngDataURLs){
  if(!AI.has())throw new Error('no-key');
  const size=W>H*1.15?'1536x1024':(H>W*1.15?'1024x1536':'1024x1024');
  /* with one or more reference images (the clean front view, and — when
     the STEP 1 reading pass ran — the annotated technical drawing too),
     use the image-EDIT endpoint, which accepts a reference image[] array,
     so the model receives the actual layout as a picture, not text alone —
     /v1/images/generations is text-to-image only and cannot take a
     reference. Falls back to the old text-only call if rasterizing every
     reference failed (svgToPngDataURL never throws, but a very old browser
     or a canvas-security error still could leave every one null) —
     degrade, don't block the feature. */
  const refs=(Array.isArray(refPngDataURLs)?refPngDataURLs:[refPngDataURLs]).filter(Boolean);
  if(refs.length){
    const form=new FormData();
    form.append('model',AI.model.image);
    form.append('prompt',prompt);
    form.append('size',size);
    form.append('quality',hiQ?'high':'low');
    form.append('n','1');
    for(let i=0;i<refs.length;i++){
      const blob=await(await fetch(refs[i])).blob();
      form.append('image[]',blob,'reference-'+i+'.png');
    }
    const r=await fetch('https://api.openai.com/v1/images/edits',{method:'POST',
      headers:{Authorization:'Bearer '+AI.getKey()},body:form});
    const d=await r.json();
    if(!r.ok)throw new Error((d.error&&d.error.message)||('HTTP '+r.status));
    return 'data:image/png;base64,'+d.data[0].b64_json;
  }
  const r=await fetch('https://api.openai.com/v1/images/generations',{method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+AI.getKey()},
    body:JSON.stringify({model:AI.model.image,prompt,size,quality:hiQ?'high':'low',n:1})});
  const d=await r.json();
  if(!r.ok)throw new Error((d.error&&d.error.message)||('HTTP '+r.status));
  return 'data:image/png;base64,'+d.data[0].b64_json;
}

        <button class="btn" id="aiKeySave" style="font-size:13px;padding:6px 12px">${T('aiKeySave')}</button>

  $('aiKeySave').addEventListener('click',()=>{AI.setKey($('aiKeyIn').value.trim());aiErrMsg='';renderAIView(res,fit,cfg);});
  $('aiKeyForget').addEventListener('click',()=>{AI.setKey('');aiErrMsg='';renderAIView(res,fit,cfg);});
  $('aiGo').addEventListener('click',async()=>{
    const b=$('aiGo');b.disabled=true;b.textContent=T('aiWorking');aiErrMsg='';
    try{
      /* render the same construction geometry the drawing and schedule are
         made from into a clean reference PNG, then send it alongside the
         literal text description — a picture of the actual layout, not
         text alone (§3, see frontPreviewSVG above). */
      const refSvg=frontPreviewSVG(res,fit,cfg);
      const refH=+(refSvg.match(/height="(\d+)"/)||[])[1]||1024;
      const refPng=await svgToPngDataURL(refSvg,1024,refH);
      /* STEP 1b — an independent reading pass over the actual TECHNICAL
         drawing (with dimensions, so the reading can cross-check them),
         separate from the clean reference above. If it succeeds and finds
         no unresolved conflict, STEP 2 renders from ITS locked description
         instead of describeDrawing()'s text, and both images go along as
         references. Any failure (no key, network, a bad response) falls
         straight back to the existing text-only description — the feature
         degrades, it never blocks generation (§5). */
      let goPrompt=prompt, goRefs=[refPng], reading=null;
      try{
        const drawingSvg=elevationSheet(res,fit,cfg,'front');
        const drawingH=+(drawingSvg.match(/height="(\d+)"/)||[])[1]||undefined;
        const drawingPng=await svgToPngDataURL(drawingSvg,1024,drawingH||1024*297/420);
        if(drawingPng)reading=await readDrawingViaVision(res,fit,cfg,drawingPng).then(r=>({...r,drawingPng}));
      }catch(readErr){
        /* the reading pass itself is unavailable (no key, network, a bad
           response) — that is not a conflict in the construction, so fall
           back to the text-only description exactly as before. */
        console.warn('[VAN] drawing reading pass unavailable, using the text-only description instead:',readErr);
      }
      if(reading){
        /* the pass ran and returned an opinion — a genuine unresolved
           conflict must stop generation and tell the user why (§5), not be
           silently swallowed the way a network failure is above. */
        if(reading.status==='needs_resolution'||(reading.conflicts&&reading.conflicts.length))
          throw new Error((reading.conflicts&&reading.conflicts[0])||'The drawing reading found an unresolved conflict.');
        goPrompt=buildImagePromptFromReading(reading,true);
        goRefs=[refPng,reading.drawingPng];
        console.log('%c[VAN] STEP 1b drawing reading (independent check)','font-weight:700;color:#1F6FEB',reading);
      }
      AIIMG[ck]=await aiRenderImage(goPrompt,aiHiQ,mm(fit.W),mm(fit.H),goRefs);
    }
    catch(err){ aiErrMsg=err.message; }
    if(view==='ai')renderAIView(res,fit,cfg);
  });
}
