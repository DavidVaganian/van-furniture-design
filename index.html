const EVIDENCE_PROMPT=`You are the evidence-reading pass for joinery software. Describe only what the image supports.
First decide whether this is an annotated plan, technical drawing, ordinary product photo, render, or mixed document.
Read printed dimensions when present. Convert centimetres to millimetres. Use null when a dimension is absent or ambiguous.
Locate the four outer cabinet corners in clockwise order from top-left and classify the camera angle. Ignore the room outside this quadrilateral.
Inventory clothing, shoes, boxes, bags, textiles, decor, reflections, people, and other furniture as ignoredObjects with bounding boxes. These objects may indicate function or occlusion, but their outlines can never become cabinet geometry.
Classify every strong line. A shelf has a board edge and terminates at supporting panels. A thin luminous line is LED; a soft line is shadow; clothing hems and box edges are content. Only carcass_edge, divider, shelf, drawer_seam, door_frame, and rail may support construction.
Find ROOT BAYS separated by full-height dividers. Then create ATOMIC COLUMNS wherever any lower or upper sub-division begins. Atomic columns allow T-junctions: dividerStart and dividerEnd describe the vertical extent of the left boundary. A full-height boundary is 0 to 1, a lower split may be .4 to 1, and a top-only cubby split may be 0 to .18. The first column always uses 0 to 1.
For every atomic column, record zones from top to bottom using normalized yStart/yEnd. When one cell spans adjacent atomic columns above a partial divider, repeat it with the same stable cellId. Set separatorBelow only when a real horizontal board closes that cell.
Distinguish open shelf spaces, hanging spaces, drawer fronts, and doors by visible structural boundaries.

/* ── memory of what this workshop actually uses ──────────────
   Every material, colour, finish, handle and hinge that gets chosen is
   remembered and offered first next time. A shop uses six materials,

const MEM={material:[],finish:[],handles:[],frontStyle:[],colour:[],sheet:[],depth:[],hinge:[]};
async function memLoad(){
  try{const r=await window.storage.get('van:choices');
    if(r&&r.value)Object.assign(MEM,JSON.parse(r.value));}catch(e){}
}

  try{await window.storage.set('van:choices',JSON.stringify(MEM));}catch(e){}
}
function remember(key,val){
  if(val===undefined||val===null||val==='')return;
  const a=MEM[key]||(MEM[key]=[]);
  const i=a.findIndex(x=>(x.v!==undefined?x.v:x)===val);

}

    `<button data-mem="${key}" data-mv="${String(v).replace(/"/g,'&quot;')}">${
      key==='colour'?`<span class="sw" style="background:${v}"></span>`:''}${label(v)}</button>`).join('')}</div>`;
}

  if(!cfg)return;
  const data=JSON.stringify(snapshot(true),null,2),blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a'),url=URL.createObjectURL(blob);
  const base=(PROJ.number||'VAN-project').replace(/[^a-z0-9_-]+/gi,'-');
  a.href=url;a.download=base+'.van.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);saveStatus('projectSaved');
}
/* §6 §7 — the download is the same GOST-convention A3 sheets shown on
   screen (drawSheet, the print renderer), never a re-derivation, so what
   the customer downloads can never drift from what step 4 shows. Fixed,
   deliberate order — front elevation (overall shape + primary dimensions)
   → side/plan (depth, or the kitchen/bathroom layout plan) → oblique 3D
   (open + closed, for spatial reading) → exploded + cut-list schedule
   (assembly, last, closest to the workshop's own use) — so dimensions
   read from general to specific instead of arriving as an unsorted pile.
   Customer-eye renders (Realistic / 3D Studio / AI photo) are pictures,
   not drawings (§7 — never for the saw), so they are deliberately left
   out of this download. No PDF library is bundled (the app stays a single
   offline file, §-architecture) — the browser's own print-to-PDF turns
   the assembled A3 pages into one real file the user saves.  */
function assembleDrawingSet(res,fit,cfg){
  return ['front','side','iso','exploded']
    .map(v=>`<div class="pg">${drawSheet(res,fit,cfg,v)}</div>`).join('');
}
function downloadDrawings(){
  if(!cfg)return;
  const{o}=readOpening();
  const fit=fitOpening({wT:o.wT,wM:o.wM,wB:o.wB,hL:o.hL,hC:o.hC,hR:o.hR,depth:o.dP,scribe:o.sc});
  resolveParametrics(cfg,fit);
  const res=generate(cfg,fit);
  const prevTitle=document.title;
  document.title=(PROJ.number||'VAN-project').replace(/[^a-z0-9_-]+/gi,'-');
  $('printSheets').innerHTML=assembleDrawingSet(res,fit,cfg);
  document.body.classList.add('printing-drawings');
  let done=false;
  const cleanup=()=>{ if(done)return; done=true;
    document.body.classList.remove('printing-drawings');
    $('printSheets').innerHTML='';
    document.title=prevTitle;
    window.removeEventListener('afterprint',cleanup); };
  window.addEventListener('afterprint',cleanup);
  window.print();
  setTimeout(cleanup,60000);   /* afterprint is reliable everywhere VAN targets — this is only a last-resort net */
  saveStatus('drawingsDownloaded');
}
function loadProjectData(st){
  if(!st||st.schema!=='van-project'||!st.cfg||!Array.isArray(st.cfg.columns))return false;
  restoreSnapshot(st);UNDO.length=0;REDO.length=0;
  step=Math.max(1,Math.min(4,+st.step||2));maxStep=Math.max(step,Math.min(4,+st.maxStep||step));
  [1,2,3,4].forEach(i=>$('s'+i).classList.toggle('hide',i!==step));
  applyLang();saveStatus('projectLoaded');scheduleAutosave();return true;
}
function restoreAutosave(){
  try{const raw=localStorage.getItem(AUTOSAVE_KEY);return raw?loadProjectData(JSON.parse(raw)):false;}
  catch(e){return false;}
}
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey, key=e.key.toLowerCase();
  if(mod&&key==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&key==='y'){e.preventDefault();redo();return;}
  /* step-3 section clipboard: copy / paste / delete the selected section */
  if(step===3){
    const tag=(e.target&&e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select')return;
    if(e.key==='Escape'&&SEL){SEL=null;renderFit();return;}
    if(SEL&&SEL.k==='part'){
      if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();
        const cs=cfg.columns||[{zones:cfg.zones}], cl=cs[SEL.ci||0];
        if(cl&&cl.zones&&cl.zones.length>1){mark(T('removeZone'));
          cl.zones.splice(Math.min(SEL.zi||0,cl.zones.length-1),1);
          cfg.zones=cs[0].zones;SEL=null;renderFit();}}
      return;
    }
    if(!SEL||SEL.k!=='section')return;
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='c'){e.preventDefault();secCopy(SEL.ci);}
    else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='v'){e.preventDefault();secPaste(SEL.ci);}
    else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'){e.preventDefault();secDuplicate(SEL.ci);}
    else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();secDelete(SEL.ci);}
  }
});

/* Navigation. maxStep exists ONLY to grey out rail buttons for steps the user
   has not reached yet. It must never block the forward flow buttons — that
   was defect B9: go(3) was refused because maxStep was still 2, so "Yes,
   that's right" did nothing at all. Forward movement always advances and
   raises maxStep; the only real gate is a disabled button (see mkBtn). */
function go(n){
  if(n<1||n>4)return;
  step=n;
  if(n>maxStep)maxStep=n;
  [1,2,3,4].forEach(i=>$('s'+i).classList.toggle('hide',i!==n));
  if(n===2)renderConfirm();
  if(n===3)renderFit();
  if(n===4)renderFinal();
  renderRail(); paintUndo(); scheduleAutosave();
  window.scrollTo({top:0,behavior:'smooth'});
}

const MAXEDGE=1568;
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc=
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const extOf=n=>(n.split('.').pop()||'').toLowerCase();
function canvasOut(src){
  const iw=src.naturalWidth||src.width,ih=src.naturalHeight||src.height;
  if(!iw||!ih)throw new Error('no-dimensions');
  const s=Math.min(1,MAXEDGE/Math.max(iw,ih));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(iw*s));c.height=Math.max(1,Math.round(ih*s));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.drawImage(src,0,0,c.width,c.height);
  const u=c.toDataURL('image/jpeg',.85);
  return{previewURL:u,base64:u.split(',')[1],mime:'image/jpeg'};
}
const decodeImage=blob=>new Promise((res,rej)=>{
  const u=URL.createObjectURL(blob),i=new Image();
  i.onload=()=>{try{res(canvasOut(i))}catch(e){rej(e)}finally{URL.revokeObjectURL(u)}};
  i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};
  i.src=u;});
async function pdfPages(f){
  if(!window.pdfjsLib)throw new Error('pdf-unavailable');
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=Math.min(pdf.numPages,8);p++){
    const pg=await pdf.getPage(p),v0=pg.getViewport({scale:1});
    const v=pg.getViewport({scale:Math.min(2,MAXEDGE/Math.max(v0.width,v0.height))});
    const c=document.createElement('canvas');c.width=v.width;c.height=v.height;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:v}).promise;
    const u=c.toDataURL('image/jpeg',.85);
    out.push({previewURL:u,base64:u.split(',')[1],mime:'image/jpeg',page:p});
  }
  return out;
}
/* Read the dominant FRONT colour out of the photo. The model names a
   colour in words; this reads the actual pixels, which is far closer.
   Sampled from the middle band where cabinetry sits, with the extremes
   thrown away so worktops, walls and shadows do not drag the result. */
function dominantColour(dataURL,outerQuad){
  return new Promise(res=>{
    const i=new Image();
    i.onload=()=>{
      const n=64,c=document.createElement('canvas');c.width=n;c.height=n;
      const x=c.getContext('2d');
      try{
        const source=Array.isArray(outerQuad)&&outerQuad.length===4?rectifyCabinetImage(i,outerQuad):i;
        x.drawImage(source,0,0,n,n);
      }catch(e){return res(null);}
      let d;try{d=x.getImageData(0,0,n,n).data;}catch(e){return res(null);}
      const px=[];
      for(let y=Math.round(n*0.25);y<n*0.85;y++)for(let q=0;q<n;q++){
        const k=(y*n+q)*4, r=d[k],g=d[k+1],b=d[k+2];
        const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
        if(mx>246&&mn>240)continue;            /* blown highlight */
        if(mx<26)continue;                      /* crushed shadow */
        px.push([r,g,b]);
      }
      if(px.length<40)return res(null);
      /* k-means, 4 clusters, then take the largest */
      let cs=[0,1,2,3].map(i2=>px[Math.floor(px.length*(i2+.5)/4)].slice());
      for(let it=0;it<9;it++){
        const sum=cs.map(()=>[0,0,0,0]);
        for(const p of px){
          let bi=0,bd=1e9;
          cs.forEach((c2,ci)=>{const dd=(p[0]-c2[0])**2+(p[1]-c2[1])**2+(p[2]-c2[2])**2;
            if(dd<bd){bd=dd;bi=ci;}});
          sum[bi][0]+=p[0];sum[bi][1]+=p[1];sum[bi][2]+=p[2];sum[bi][3]++;
        }
        cs=cs.map((c2,ci)=>sum[ci][3]?[sum[ci][0]/sum[ci][3],sum[ci][1]/sum[ci][3],sum[ci][2]/sum[ci][3]]:c2);
        cs.counts=sum.map(v=>v[3]);
      }
      const sum=cs.map(()=>0);
      for(const p of px){let bi=0,bd=1e9;
        cs.forEach((c2,ci)=>{const dd=(p[0]-c2[0])**2+(p[1]-c2[1])**2+(p[2]-c2[2])**2;
          if(dd<bd){bd=dd;bi=ci;}});sum[bi]++;}
      const best=cs[sum.indexOf(Math.max(...sum))].map(v=>Math.round(v));
      res('#'+best.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join(''));
    };
    i.onerror=()=>res(null);
    i.src=dataURL;
  });
}
async function ingest(f){
  const e=extOf(f.name);
  if(f.type==='application/pdf'||e==='pdf')return{kind:'pdf',pages:await pdfPages(f)};
  if(/heic|heif/.test(f.type)||['heic','heif'].includes(e)){
    if(!window.heic2any)throw new Error('heic-unavailable');
    let b=await heic2any({blob:f,toType:'image/jpeg',quality:.92});
    if(Array.isArray(b))b=b[0];
    return{kind:'image',img:await decodeImage(b)};}
  return{kind:'image',img:await decodeImage(f)};
}

async function handleFile(f){
  $('pdfpick').classList.add('hide');
  busy(T('converting'),f.name);
  let r;
  try{r=await ingest(f);}
  catch(err){busy(T('badFile'),f.name+' — '+err.message,true);setTimeout(clearBusy,4200);return;}
  if(r.kind==='pdf'){
    if(!r.pages.length){busy(T('badFile'),f.name,true);setTimeout(clearBusy,3500);return;}
    if(r.pages.length===1)return proceed(r.pages[0]);
    clearBusy();
    const pick=$('pdfpick');
    $('pdfthumbs').innerHTML=r.pages.map((p,i)=>
      `<button class="tile pg" data-pg="${i}"><img src="${p.previewURL}" alt=""><span>${T('page')} ${p.page}</span></button>`).join('');
    pick.classList.remove('hide');
    $('pdfthumbs').querySelectorAll('[data-pg]').forEach(el=>
      el.addEventListener('click',()=>{pick.classList.add('hide');proceed(r.pages[+el.dataset.pg]);}));
    pick.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  proceed(r.img);
}
async function proceed(img){
  photoURL=img.previewURL; SEL=null; UNDO.length=0;REDO.length=0;
  busy(T('analysingStructure'),T('readingSub'));
  try{cfg=normaliseRecognition(await analyse(img.base64,img.mime,CAT));if(!cfg.columns[0].zones.length)throw new Error('empty-structure');}
  catch(e){
    cfg=null;busy(T('recognitionFailed'),T('recognitionFailedHelp'),true);setTimeout(clearBusy,6500);return;
  }
  let picked=null;
  try{picked=await dominantColour(img.previewURL,cfg.sourceAnalysis&&cfg.sourceAnalysis.outerQuad);}catch(e){}
  if(picked)cfg.colour=picked;
  const sm=cfg.sourceMeasurements||{},start=cfg.suggestedMeasurements||sm;
  if(start.widthMm){$('wT').value=$('wM').value=$('wB').value=Math.round(start.widthMm);}
  if(start.heightMm){$('hL').value=$('hC').value=$('hR').value=Math.round(start.heightMm);}

}

/* Wardrobe room planner. The room, frames and fittings are stored in the
   project; the familiar cabinet generator receives an unrolled set of
   sections, so every visual edit still reaches drawings and the cut list. */
function wardrobePlannerReconcile(){
  const p=cfg&&cfg.wardrobePlanner,cols=cfg&&cfg.columns;if(!p||!Array.isArray(cols)||!cols.length)return p;
  const old=p.frames||[],byId=new Map(old.map(f=>[f.id,f])),used=new Set(),next=[];
  for(const c of cols){
    let f=c.plannerId&&byId.get(c.plannerId);
    if(!f||used.has(f.id)){
      const src=f||old[next.length]||old[old.length-1];
      f=src?JSON.parse(JSON.stringify(src)):{kind:'frame',wall:'back',w:mm(600),d:mm(580),h:mm(2200),front:'none',handle:'grooved',interior:'hanging',light:false,zones:[]};
      f.id='wf-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
    }
    used.add(f.id);c.plannerId=f.id;f.zones=c.zones||f.zones||[];
    if(c.wmm)f.w=c.wmm;
    next.push(f);
  }
  p.frames=next;
  if(!next.some(f=>f.id===WPSEL))WPSEL=next[0].id;
  return p;
}
function wardrobePlannerEnsure(){
  if(cfg.wardrobePlanner){
    const p=wardrobePlannerReconcile();
    if(!WPSEL&&p.frames[0])WPSEL=p.frames[0].id;return p;
  }
  const roomW=mm(Math.max(1200,num($('wM').value)||3000)),roomH=mm(Math.max(1900,num($('hC').value)||2400));
  const roomD=mm(3000),depth=mm(Math.max(350,Math.min(800,num($('dP').value)||580)));
  const src=(cfg.sourceMeasurements&&cfg.sourceMeasurements.widthMm)||0,cols=(cfg.columns&&cfg.columns.length)?cfg.columns:[{w:1,zones:cfg.zones||[]}];
  const available=mm(src||Math.min(2400,mmv(roomW)-30)),weight=cols.reduce((n,c)=>n+(c.w||1),0)||1;
  const frames=cols.map((c,i)=>{
    const raw=cols.length===1&&!src?mm(1000):Math.max(mm(300),Math.round(available*(c.w||1)/weight));
    let front=(c.zones||[]).some(z=>z.type==='doors')?'hinged':'none';
    const zones=JSON.parse(JSON.stringify(c.zones||[{type:'open',ratio:1,shelves:4}]));
    zones.forEach(z=>{if(z.type==='doors'){z.type='open';z.shelves=z.shelves||2;z.rail=!!z.rail;}});
    return{id:'wf-'+Date.now().toString(36)+'-'+i,kind:'frame',wall:'back',w:raw,d:depth,h:Math.min(mm(2360),roomH-mm(10)),front,frontCount:front==='hinged'?(raw>mm(650)?2:1):1,handle:cfg.handles||'grooved',interior:'custom',light:false,zones};

function zAdj(zi,d,f,ci){

  if(f==='ncol'){ D>0?addSection():removeSection(); return renderConfirm(); }
  if(f==='colw'){ cols[C].w=Math.max(.06,(cols[C].w||1/cols.length)+D*0.06); reweight(); return renderConfirm(); }
  if(f==='delcol'){ if(cols.length>1)cols.splice(C,1); reweight(); cfg.zones=cols[0].zones;syncRecognition(); return renderConfirm(); }
  if(f==='addzone'){

    cols[C].zones.forEach((z,i)=>z.separatorBelow=i<cols[C].zones.length-1);cfg.zones=cols[0].zones;syncRecognition();return renderConfirm();

    return `<div class="msg ${m.l}${first?' act':''}" data-mi="${i}"
      ${first?`data-fk="${first.k}" data-fv="${first.v}" data-fc="${first.c||0}" role="button" tabindex="0"`:''}>
      <span class="d"></span><span>${tag}${m.t}${
        (m.fixes||[]).map((f,j)=>` <button class="fixbtn${j?'':' primary'}" data-fk="${f.k}"
          data-fv="${f.v}" data-fc="${f.c||0}">${f.label}</button>`).join('')}</span></div>`;
  }).join('');
  remember('depth',N(mmv(fit.D)));
  const blocked=bad.length>0||msgs.some(m=>m.l==='err');
  $('mkBtn').disabled=blocked;   /* the only real gate on reaching step 4 */
  renderRail();scheduleAutosave();
}
Object.keys(LIMITS).forEach(id=>{
  const el=$(id);
  el.addEventListener('focus',()=>{measureBefore=snapshot(false);});
  el.addEventListener('beforeinput',()=>{if(!measureBefore)measureBefore=snapshot(false);});
  el.addEventListener('input',()=>{if(step===3)renderFit();});
  el.addEventListener('change',()=>{
    if(cfg){cfg.measurementSources=cfg.measurementSources||{};const axis=id[0]==='w'?'widthMm':id[0]==='h'?'heightMm':'depthMm';cfg.measurementSources[axis]='user';}
    commitPendingHistory(T('sizeEdit'));
    scheduleAutosave();
  });
});

/* ── step 4 ── */
/* one owner of the viewport: SVG sheet, or the WebGL scene */
/* §10 — expose the live model so the 3D can be audited against the cut list */
window.VAN={get cfg(){return cfg},get view(){return view},
  build:(o)=>{const r=readOpening().o;
    const f=fitOpening(o||{wT:r.wT,wM:r.wM,wB:r.wB,hL:r.hL,hC:r.hC,hR:r.hR,depth:r.dP,scribe:r.sc});
    return{fit:f,res:generate(cfg,f)};}};
function paintViewport(res,fit,cfg){
  if(view!=='studio'&&STUDIO_KEY){document.removeEventListener('keydown',STUDIO_KEY);STUDIO_KEY=null;}
  if(view==='real'){
    if($('viewport').querySelector('#glhost')===null)
      $('viewport').innerHTML='<div id="glhost"></div>';
    mountRealistic(res,fit,cfg);
  }else if(view==='studio'){
    if($('viewport').querySelector('#studiohost')===null)$('viewport').innerHTML='<div id="studiohost"></div>';
    mountStudio(res,fit,cfg);
  }else if(view==='ai'){
    if(GL&&GL.raf){cancelAnimationFrame(GL.raf);GL.raf=0;}
    renderAIView(res,fit,cfg);
  }else{
    if(GL&&GL.raf){cancelAnimationFrame(GL.raf);GL.raf=0;}
    $('viewport').innerHTML=drawSheet(res,fit,cfg,view);
  }
}
function hardwareHTML(res,cfg){
  const doors=res.parts.filter(p=>p.k==='door');
  if(res.kitchen){const KT=T('kitchenTypes'),KM=T('kitchenMapping'),apps=res.appliances.map(a=>a.type==='hood'?KM.hood[a.hoodType||'integrated']:(KT[a.cabinetType||(a.type==='fridge'?'tallFridge':a.type)]||a.type));
    return `<div class="hero">${res.totalHinges}</div><div>${T('totalHinges')}</div>
      <div class="kv" style="margin-top:14px"><b>${T('kitchenHardware')}</b><br>${res.legs} ${T('kitchenLegs')}<br>${res.nShelf*4} ${T('shelfPins')}<br>${res.cutouts.length} ${T('kitchenCutouts')}</div>
      <div class="kv" style="margin-top:12px"><b>${T('kitchenAppliances')}</b><br>${apps.length?apps.join('<br>'):T('kitchenNoAppliances')}</div>`;}
  if(res.bathroom)return `<div class="hero">${res.basins.length}</div><div>${res.bathroomModel.basinType==='vessel'?'Countertop':'Integrated'} basin${res.basins.length===1?'':'s'}</div>
    <div class="kv" style="margin-top:14px"><b>Worktop operations</b><br>${res.cutouts.length} drilled / routed opening${res.cutouts.length===1?'':'s'}<br>${res.plumbingNotches} siphon-clearance operation${res.plumbingNotches===1?'':'s'}<br>${res.services.length} hot/cold/waste service set${res.services.length===1?'':'s'}</div>
    <div class="kv" style="margin-top:12px"><b>Installation</b><br>${res.mount==='wall'?`Wall hung · ${F(res.floorClearance)} mm floor clearance`:'Floor standing'}<br>Waste Ø ${F(res.bathroomModel.drainD)} mm</div>`;
  return doors.length?`<div class="hero">${res.totalHinges}</div><div>${T('totalHinges')}</div>`+doors.map(p=>p.frontMode==='sliding'
    ?`<div class="kv" style="margin-top:12px"><b>${p.q} × ${F(p.fl)} × ${F(p.fw)} mm</b><br>Sliding front · top and bottom track set</div>`
    :`<div class="kv" style="margin-top:12px"><b>${p.q} × ${F(p.fl)} × ${F(p.fw)} mm</b><br>${T('hingesFor')}: <b>${p.hinges.count}</b><br>${T('doorWeight')}: ${p.hinges.kg.toFixed(1)} kg<br>${T('hingePos')}: ${p.hinges.positions.map(F).join(' · ')} mm</div>`).join('')+`<div class="kv">${res.nShelf*4} ${T('shelfPins')}</div>`:'—';
}
function renderFinal(){
  if(!cfg)return;
  const{o}=readOpening();
  const fit=fitOpening({wT:o.wT,wM:o.wM,wB:o.wB,hL:o.hL,hC:o.hC,hR:o.hR,depth:o.dP,scribe:o.sc});
  resolveParametrics(cfg,fit);
  const res=generate(cfg,fit),msgs=validate(cfg,fit,res),P=T('parts'),M=T('mats');
  $('s4lede').innerHTML=`<b>${F(fit.W)} × ${F(fit.H)} × ${F(fit.D)} mm</b> · ${res.parts.reduce((a,x)=>a+x.q,0)} ${T('tPart').toLowerCase()}`;
  $('tblock').innerHTML=[['number','shProject'],['customer','shCustomerL'],['designer','shDesignerL']]
    .map(([k,lbl])=>`<label>${T(lbl)}<input data-proj="${k}" value="${PROJ[k]||''}"></label>`).join('');
  $('tblock').querySelectorAll('[data-proj]').forEach(el=>{
    el.addEventListener('focus',()=>{projectBefore=snapshot(false);});
    el.addEventListener('beforeinput',()=>{if(!projectBefore)projectBefore=snapshot(false);});
    el.addEventListener('input',e=>{PROJ[e.target.dataset.proj]=e.target.value;
      paintViewport(res,fit,cfg);scheduleAutosave();});
    el.addEventListener('change',()=>{
      commitPendingHistory(T('shProject'));
    });
  });
  const baseLabels=isKitchen(cfg)?T('kitchenViews'):(isBathroom(cfg)?T('views').map((v,i)=>i===1?'Services plan':v):T('views'));
  const viewLabels=baseLabels.slice(0,5).concat([SU('tab'),baseLabels[5]]),viewKeys=['front','side','iso','exploded','real','studio','ai'];
  $('vtabs').innerHTML=viewLabels.map((v,i)=>{const k=viewKeys[i];
    return`<button data-view="${k}" aria-pressed="${view===k}">${v}</button>`;}).join('');
  paintViewport(res,fit,cfg);
  $('finalmsgs').innerHTML=msgs.map((m,i)=>{
    const first=(m.fixes||[])[0];
    return `<div class="msg ${m.l}${first?' act':''}"
      ${first?`data-fk="${first.k}" data-fv="${first.v}" data-fc="${first.c||0}" role="button" tabindex="0"`:''}>
      <span class="d"></span><span>${m.anchor?`<span class="bub ${m.l}">${i+1}</span>`:''}${m.t}${
        (m.fixes||[]).map((f,j)=>` <button class="fixbtn${j?'':' primary'}" data-fk="${f.k}"
          data-fv="${f.v}" data-fc="${f.c||0}">${f.label}</button>`).join('')}</span></div>`;}).join('');
  $('hw').innerHTML=hardwareHTML(res,cfg);
  $('cut').innerHTML=compactCutParts(res).map(x=>`<tr class="${x.k==='filler'?'flag':''}">
    <td class="l">${P[x.k]}${x.k==='filler'?` <span style="color:var(--flag);font-weight:600">— ${T('scribelong')}</span>`:''}</td>
    <td>${x.q}</td><td class="big">${F(x.cl)}</td><td class="big">${F(x.cw)}</td><td>${F(x.th)}</td>
    <td class="l mute">${x.mat==='front'?T('materials')[cfg.material||'laminate']:M[x.mat]}${
      (x.mat==='back'||x.mat==='box')?'':' · '+T(orient(x,SH(cfg))==='across'?'grainAcross':'grainAlong')}</td><td class="l mute">${x.edgeCode?x.edgeCode+' '+x.edgeWhere:'—'}</td></tr>`).join('');
  const grp={};
  for(const x of cutParts(res)){ if(x.mat==='rail')continue;
    const g=grp[x.mat]||(grp[x.mat]={a:0,kg:0,t:x.th});
    const a=(x.cl/10)*(x.cw/10)*x.q/1e6;g.a+=a;g.kg+=a*(x.th/1e4)*R.density[x.mat];}
  const St=SH(cfg), sa=(St.l/10)*(St.w/10)/1e6;
  $('matrows').innerHTML=Object.entries(grp).map(([k,g])=>{
    const sh=Math.max(1,Math.ceil(g.a/(sa*R.yield)));
    return`<tr><td class="l">${M[k]}</td><td class="big">${g.a.toFixed(2)} m²</td><td class="big">${sh}</td>
      <td>${((1-g.a/(sh*sa))*100).toFixed(0)} %</td><td>${g.kg.toFixed(1)} kg</td></tr>`;}).join('');
  const edge=cutParts(res).reduce((a,x)=>x.edgeCode
    ?a+((x.edges.l?x.cl:0)+(x.edges.rt?x.cl:0)+(x.edges.tp?x.cw:0)+(x.edges.bt?x.cw:0))*x.q:a,0)/1e4;
  $('sum').innerHTML=`<div><div class="k">${T('tQty')}</div><div class="v">${res.parts.reduce((a,x)=>a+x.q,0)}</div></div>
    <div><div class="k">${T('tEdge')} +10 %</div><div class="v">${(edge*1.1).toFixed(1)} m</div></div>
    <div><div class="k">${T('tWeight')}</div><div class="v">${Object.values(grp).reduce((a,g)=>a+g.kg,0).toFixed(0)} kg</div></div>`;
  const pr=price(res,cfg,fit), c=v=>v.toLocaleString('da-DK')+' '+pr.cur;
  $('price').innerHTML=`<table class="pricetbl">
    <tr><td class="l">${T('pMat')}</td><td class="big">${c(pr.materials)}</td></tr>
    <tr><td class="l">${T('pEdge')}</td><td class="big">${c(pr.edging)}</td></tr>
    <tr><td class="l">${T('pHw')}</td><td class="big">${c(pr.hardware)}</td></tr>
    <tr><td class="l">${T('pLabour')}</td><td class="big">${c(pr.labour)}</td></tr>
    <tr class="sub"><td class="l">${T('pCost')}</td><td class="big">${c(pr.cost)}</td></tr>
    <tr><td class="l mute">${T('pMargin')} ${Math.round(RATES.margin*100)} %</td><td class="big mute">${c(pr.margin)}</td></tr>
    <tr class="tot"><td class="l">${T('pTotal')}</td><td class="big">${c(pr.total)}</td></tr>
  </table><div style="font-size:11px;color:var(--flag);margin-top:8px">${T('pPlaceholder')}</div>`;
  scheduleAutosave();
}

$('noPhoto').addEventListener('change',e=>{
  const off=e.target.checked;
  $('photoBlock').classList.toggle('hide',off);
  $('pdfpick').classList.add('hide');
  document.querySelector('.or').classList.toggle('hide',off);
});
if(!restoreAutosave())applyLang(); /* resume the last project when one exists */
memLoad().then(()=>{ if(step===2)renderConfirm(); });
</script>
<div id="printSheets" aria-hidden="true"></div>
</body>
</html>
